        name: 'NiFi Storage: repositorio acima de {$NIFI.REPO_PCT.WARN}%'
        priority: WARNING
        description: 'Repositorio (flowfile/content/provenance) acima de {$NIFI.REPO_PCT.WARN}%
          (TO-BE 1.1). Dependente da trigger High para nao duplicar notificacoes.'
        manual_close: 'YES'
        dependencies:
        - name: 'NiFi Storage: repositorio acima de {$NIFI.REPO_PCT.HIGH}%'
