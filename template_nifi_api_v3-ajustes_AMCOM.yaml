  - uuid: 8b391308d1e74d1d979b1e740dab6231
    template: Apache NiFi API by JS Queues
    name: Apache NiFi API by JS Queues
    description: 'Coleta de filas (connections) por Process Group descoberto:

      - Objetos e bytes em fila

      - % do back pressure (objetos e bytes)

      - Idade do dado mais antigo na fila (s)

      '
    groups:
    - name: Templates
    discovery_rules:
    - uuid: 11691297acdd43bdac126c83b5a51be2
      key: nifi.discovery.queues
      name: Descoberta de filas por PG
      status: DISABLED
      type: HTTP_AGENT
      request_method: GET
      url: '{$NIFI.URL}/flow/process-groups/{$NIFI.ROOT_PG_ID}'
      timeout: '{$NIFI.TIMEOUT}'
      delay: 5m
      lifetime: 30d
      description: 'DESATIVADA (TO-BE DBT-6131): substituida pela "Descoberta de
        Fluxos" (nifi.fluxo.fila_uso / nifi.fluxo.contrapressao / nifi.fluxo.fila[{#FLUXO_ID}]...),
        que ja acumula filas do subgrupo inteiro. Reativar so se preciso; nao excluir.'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nvar conns = (body.processGroupFlow && body.processGroupFlow.flow\
          \ && body.processGroupFlow.flow.connections)\n  ? body.processGroupFlow.flow.connections\
          \ : [];\nvar rows = [];\nconns.forEach(function (c) {\n  if (!c.component)\
          \ { return; }\n  rows.push({\n    '{#PGID}': c.component.parentProcessGroupId\
          \ || '',\n    '{#PGNAME}': c.component.parentProcessGroupId || '',\n   \
          \ '{#CONNID}': c.component.id,\n    '{#CONNNAME}': c.component.name || c.component.id,\n\
          \    '{#SRC}': c.component.source && c.component.source.name ? c.component.source.name\
          \ : '',\n    '{#DEST}': c.component.destination && c.component.destination.name\
          \ ? c.component.destination.name : ''\n  });\n});\nreturn JSON.stringify({\
          \ 'data': rows });\n"
      item_prototypes:
      - uuid: 959405a3d4774c4c956f672c1b016af2
        key: nifi.queue.raw[{#CONNID}]
        name: 'Fila {#CONNNAME}: Status (raw)'
        type: HTTP_AGENT
        value_type: TEXT
        history: 1d
        trends: '0'
        request_method: GET
        url: '{$NIFI.URL}/connections/{#CONNID}'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            return JSON.stringify(body.connection || body);

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: 6647c9e68cbf4edf9e7609bab2cc3a34
        key: nifi.queue.objects[{#CONNID}]
        name: 'Fila {#CONNNAME}: Objetos em fila'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 31d
        trends: 400d
        request_method: GET
        url: '{$NIFI.URL}/connections/{#CONNID}'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var b = JSON.parse(value);

            var q = (b.queueSummary || b);

            return parseInt((q.queueSize && q.queueSize.objectCount) || 0, 10);

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: bb09f710c54f43799591ce75e0841496
        key: nifi.queue.bytes[{#CONNID}]
        name: 'Fila {#CONNNAME}: Bytes em fila'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 31d
        trends: 400d
        units: B
        request_method: GET
        url: '{$NIFI.URL}/connections/{#CONNID}'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var b = JSON.parse(value);

            var q = (b.queueSize || b);

            return parseInt(q.queueSize && q.queueSize.byteCount || 0, 10);

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: ed0e2711510f4f9bacd06521a5b577b9
        key: nifi.queue.bp_objects_pct[{#CONNID}]
        name: 'Fila {#CONNNAME}: Back pressure objetos (%)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 31d
        trends: 400d
        units: '%'
        request_method: GET
        url: '{$NIFI.URL}/connections/{#CONNID}'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var b = JSON.parse(value);

            var q = b.queue || b;

            var obj = parseInt((q.queueSize && q.queueSize.objectCount) || 0, 10);

            var bp = parseInt((q.backPressure && q.backPressure.objectThreshold) ||
            0, 10);

            if (bp <= 0) { return 0; }

            return Math.round(100 * obj / bp * 100) / 100;

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: 3100d9d7fce447feaa55cc96485db9fe
        key: nifi.queue.bp_bytes_pct[{#CONNID}]
        name: 'Fila {#CONNNAME}: Back pressure bytes (%)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 31d
        trends: 400d
        units: '%'
        request_method: GET
        url: '{$NIFI.URL}/connections/{#CONNID}'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var b = JSON.parse(value);

            var q = b.queue || b;

            var bytes = parseInt((q.queueSize && q.queueSize.byteCount) || 0, 10);

            var bp = parseInt((q.backPressure && q.backPressure.bytesThreshold) ||
            0, 10);

            if (bp <= 0) { return 0; }

            return Math.round(100 * bytes / bp * 100) / 100;

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: 391b59edaca542e4b404b36972367cc1
        key: nifi.queue.oldest[{#CONNID}]
        name: 'Fila {#CONNNAME}: Idade do dado mais antigo (s)'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 31d
        trends: 400d
        units: s
        request_method: GET
        url: '{$NIFI.URL}/connections/{#CONNID}'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var b = JSON.parse(value);

            var q = b.queue || b;

            var ts = parseInt((q.oldestFlowFileTimestamp || q.oldestFlowFileEventTimestamp
            || 0), 10);

            if (ts <= 0) { return 0; }

            return Math.max(0, Math.floor(Date.now() / 1000) - Math.floor(ts / 1000));

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      lld_macro_paths:
      - lld_macro: '{#PGID}'
        path: $.pgid
      - lld_macro: '{#PGNAME}'
        path: $.pgname
      - lld_macro: '{#CONNID}'
        path: $.connid
      - lld_macro: '{#CONNNAME}'
        path: $.connname
      - lld_macro: '{#SRC}'
        path: $.src
      - lld_macro: '{#DEST}'
        path: $.dest
      trigger_prototypes:
      - uuid: 47448afc846f4c84a57f3d9dd923f768
        expression: min(/Apache NiFi API by JS Queues/nifi.queue.bp_objects_pct[{#CONNID}],10m)>{$NIFI.QUEUE_BACKPRESSURE_PCT}
        name: 'Fila {#CONNNAME}: back pressure objetos > {$NIFI.QUEUE_BACKPRESSURE_PCT}%'
        priority: AVERAGE
        description: Fila {#CONNNAME} (PG {#PGNAME}) proxima do back pressure por
          objetos.
        manual_close: 'YES'
        tags:
        - tag: queue
          value: '{#CONNNAME}'
        - tag: scope
          value: performance
      - uuid: 3e9bd2fc749143de80a47ed99eb1f173
        expression: min(/Apache NiFi API by JS Queues/nifi.queue.bp_bytes_pct[{#CONNID}],10m)>{$NIFI.QUEUE_BACKPRESSURE_PCT}
        name: 'Fila {#CONNNAME}: back pressure bytes > {$NIFI.QUEUE_BACKPRESSURE_PCT}%'
        priority: AVERAGE
        description: Fila {#CONNNAME} (PG {#PGNAME}) proxima do back pressure por
          bytes.
        manual_close: 'YES'
        tags:
        - tag: queue
          value: '{#CONNNAME}'
        - tag: scope
          value: performance
      - uuid: 42d337fb5aff407b9c4c99ac21a601e0
        expression: min(/Apache NiFi API by JS Queues/nifi.queue.oldest[{#CONNID}],10m)>{$NIFI.QUEUE_AGE_MIN}
        name: 'Fila {#CONNNAME}: dados parados'
        priority: AVERAGE
        description: O dado mais antigo da fila {#CONNNAME} tem mais de {$NIFI.QUEUE_AGE_MIN}
          segundos.
        manual_close: 'YES'
        tags:
        - tag: queue
          value: '{#CONNNAME}'
        - tag: scope
          value: performance
      headers:
      - name: Authorization
        value: Bearer {$NIFI.TOKEN}
    vendor:
      name: Internal
      version: '1.0'
  - uuid: 6ea516b0c08843979f4df14685b3d4d4
    template: Apache NiFi API by JS Counters
    name: Apache NiFi API by JS Counters
    description: 'Descoberta e coleta de counters do NiFi via /counters.

      Permite acompanhar metricas customizadas criadas nos fluxos (UpdateCounter).

      '
    groups:
    - name: Templates
    discovery_rules:
    - uuid: d7b1d9fd39844ef380a0307fe4bba15e
      key: nifi.discovery.counters
      name: Descoberta de counters
      type: HTTP_AGENT
      request_method: GET
      url: '{$NIFI.URL}/counters'
      timeout: '{$NIFI.TIMEOUT}'
      delay: 5m
      lifetime: 30d
      description: Descobre counters registrados (filtra por {$NIFI.COUNTERS_FILTER}
        regex).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nvar cs = (body.counters && body.counters.counters)\
          \ ? body.counters.counters : [];\nvar rx = '{$NIFI.COUNTERS_FILTER}';\n\
          var rows = [];\ncs.forEach(function (c) {\n  var id = (c.counter && c.counter.id)\
          \ ? c.counter.id : c.id;\n  var nm = (c.counter && c.counter.name) ? c.counter.name\
          \ : (c.name || id);\n  if (rx && rx.trim() !== '') {\n    var re = new RegExp(rx,\
          \ 'i');\n    if (!re.test(nm)) { return; }\n  }\n  rows.push({ '{#COUNTERID}':\
          \ String(id), '{#COUNTERNAME}': String(nm) });\n});\nreturn JSON.stringify({\
          \ 'data': rows });\n"
      item_prototypes:
      - uuid: 50e04fcceadd4b39a91f8f3b856f33e0
        key: nifi.counter.value[{#COUNTERNAME}]
        name: 'Counter {#COUNTERNAME}: Valor'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 31d
        trends: 400d
        request_method: GET
        url: '{$NIFI.URL}/counters/{#COUNTERID}'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var b = JSON.parse(value);

            var c = (b.counter && b.counter.value != null) ? b.counter : ((b.counter)
            ? b.counter : null);

            if (!c && b.counters && b.counters.counters && b.counters.counters[0])
            { c = b.counters.counters[0].counter; }

            var v = c && (c.value != null) ? c.value : (c && c.count != null ? c.count
            : 0);

            return parseInt(v, 10) || 0;

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      lld_macro_paths:
      - lld_macro: '{#COUNTERID}'
        path: $.counterid
      - lld_macro: '{#COUNTERNAME}'
        path: $.countername
      headers:
      - name: Authorization
        value: Bearer {$NIFI.TOKEN}
    vendor:
      name: Internal
      version: '1.0'
