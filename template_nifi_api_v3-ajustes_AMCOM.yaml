      timeout: '{$NIFI.TIMEOUT}'
      delay: 1h
      lifetime: 30d
      description: 'DESATIVADA (TO-BE DBT-6131): substituida pela "Descoberta de
        Fluxos" (nifi.fluxos.descoberta), que enxerga parados/invalidos dentro de
        subgrupos e filas em contrapressao. Reativar so se a descoberta nova nao for
        homologada; nao excluir.'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nvar flow = (body.processGroupFlow && body.processGroupFlow.flow)\
          \ ? body.processGroupFlow.flow : null;\nvar rootId = body.processGroupFlow\
          \ ? body.processGroupFlow.id : '{$NIFI.ROOT_PG_ID}';\nvar groups = flow\
          \ ? (flow.processGroups || []) : [];\nvar rows = [];\ngroups.forEach(function\
          \ (g) {\n  var comp = g.component ? g.component : g;\n  if (!comp.id) {\
          \ return; }\n  rows.push({ '{#PGID}': comp.id, '{#PGNAME}': comp.name ||\
          \ comp.id, '{#PGPATH}': '/' });\n});\nif (!rows.length) {\n  rows.push({\
          \ '{#PGID}': rootId, '{#PGNAME}': 'root', '{#PGPATH}': '/' });\n}\nreturn\
          \ JSON.stringify({ 'data': rows });\n"
