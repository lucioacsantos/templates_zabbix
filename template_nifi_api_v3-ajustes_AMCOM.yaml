zabbix_export:
  version: '7.4'
  templates:
  - uuid: 20ef1da317484076ab7ac8ca26f5e835
    template: Apache NiFi API by JS
    name: Apache NiFi API by JS
    description: 'Template master para monitoramento do Apache NiFi via API REST (/flow,
      /controller, /counters).

      Coleta e processamento com JavaScript embutido (item HTTP + preprocessing JS),
      sem agente.


      Autenticacao: header "Authorization: Bearer {$NIFI.TOKEN}" em todas as chamadas.
      O token (JWT de ~8h) e renovado pelo playbook/cron renovar_nifi_token (login {$NIFI.USER}/{$NIFI.PASSWORD}
      em /access/token) e o sinal do cron chega no item trapper nifi.token.renovado
      (zabbix_sender -k nifi.token.renovado -o 1); item de login embarcado roda apenas
      1x/hora para diagnostico.


      TO-BE (DBT-6131): descoberta de fluxos via nifi.fluxos.status (recursive=true),
      com itens/triggers por fluxo ({$NIFI.FLUXO.PROFUNDIDADE}), alerta de parado so
      para {$NIFI.DEVE_RODAR:"<ID do PG>"}=1 no host, storage com limiares PROPRIOS
      ({$NIFI.REPO_PCT.WARN}/{$NIFI.REPO_PCT.HIGH}), heap em 80% e bulletins com item
      nifi.api.bullets.error.


      LLD antigas (Process Groups / filas por PG), itens nifi.cluster.nodes/nodes_connected
      e trigger antiga de bullets vem DESATIVADAS (nao excluidas) — poderao ser reativadas
      ou removidas apos homologacao das descobertas novas.


      Permissoes minimas da conta no NiFi: "view the user interface", "view system
      diagnostics" e "view the component" no grupo raiz (nao precisa de /controller).


      Recomendacao TO-BE: instalar Zabbix agent 2 na VM e vincular "Linux by Zabbix
      agent" para CPU/memoria/disco (vinculo por host, fora deste template).


      Requer Zabbix Server/Proxy >= 7.4 e conectividade HTTP(S) ate a API do NiFi.'
    groups:
    - name: Templates
    macros:
    - macro: '{$NIFI.URL}'
      value: https://nifi.exemplo.com:8443/nifi-api
      description: 'URL base da API REST do NiFi (sem barra final). Ex.: https://host:8443/nifi-api'
    - macro: '{$NIFI.USER}'
      value: ''
      description: Usuario para autenticacao Basic. Vazio = sem autenticacao.
    - macro: '{$NIFI.PASSWORD}'
      type: SECRET_TEXT
      description: Senha para autenticacao Basic.
    - macro: '{$NIFI.TOKEN}'
      type: SECRET_TEXT
      description: 'Token de acesso do NiFi. Preencha com um token de longa duracao
        OU deixe vazio e use {$NIFI.USER}/{$NIFI.PASSWORD}: o item de login obtera
        o token em {$NIFI.URL}/access/token e guardara no valor do item.'
    - macro: '{$NIFI.AUTH}'
      value: basic
      description: 'Modo de autenticacao: basic (login automatico via {$NIFI.USER}/{$NIFI.PASSWORD}
        em /access/token, token armazenado em {$NIFI.TOKEN}) ou token (usa {$NIFI.TOKEN}
        direto).'
    - macro: '{$NIFI.ROOT_PG_ID}'
      value: root
      description: ID do Process Group raiz (ou "root").
    - macro: '{$NIFI.PROCESS_GROUPS}'
      value: ''
      description: Lista estatica de IDs de Process Groups separados por virgula.
        Vazio = descobrir via API.
    - macro: '{$NIFI.TIMEOUT}'
      value: 15s
      description: 'Timeout das requisicoes HTTP (com unidade, ex.: 15s ou {$X}s).'
    - macro: '{$NIFI.RETRIES}'
      value: '2'
      description: Tentativas extras em caso de falha.
    - macro: '{$NIFI.QUEUE_BACKPRESSURE_PCT}'
      value: '80'
      description: '% do back pressure (object/bytes threshold) para trigger de fila
        saturada.'
    - macro: '{$NIFI.QUEUE_AGE_MIN}'
      value: '300'
      description: Idade maxima (s) do dado mais antigo na fila antes do trigger.
    - macro: '{$NIFI.BULLETS_WARN}'
      value: '0'
      description: Quantidade de bullets em WARNING para trigger.
    - macro: '{$NIFI.BULLETS_ERROR}'
      value: '1'
      description: Quantidade de bullets em ERROR para trigger.
    - macro: '{$NIFI.PROC_STOPPED}'
      value: '0'
      description: Processadores stopped/invalid/disabled tolerados antes do trigger
        (>=).
    - macro: '{$NIFI.GC_PCT}'
      value: '80'
      description: '% de tempo em GC da JVM para trigger.'
    - macro: '{$NIFI.HEAP_PCT}'
      value: '80'
      description: '% de heap da JVM para trigger (TO-BE: 80).'
    - macro: '{$NIFI.REPO_PCT.WARN}'
      value: '70'
      description: '% de uso dos repositorios (flowfile/content/provenance) para trigger
        Warning (TO-BE: 70).'
    - macro: '{$NIFI.REPO_PCT.HIGH}'
      value: '90'
      description: '% de uso dos repositorios para trigger High (TO-BE: 90). A trigger
        Warning depende desta para nao duplicar notificacoes.'
    - macro: '{$NIFI.DEVE_RODAR}'
      value: '0'
      description: 'Padrao (sem contexto) para fluxos descobertos. No host, defina
        {$NIFI.DEVE_RODAR:"<ID do process group>"}=1 para cada fluxo que deve rodar
        — o alerta de fluxo parado so dispara para esses IDs (TO-BE 1.3).'
    - macro: '{$NIFI.FLUXO.PROFUNDIDADE}'
      value: '1'
      description: 'Profundidade (sob a raiz) do que conta como "fluxo" na descoberta:
        1 = grupos logo abaixo da raiz, 2 = um nivel abaixo, 0 = todos os niveis.'
    - macro: '{$NIFI.COUNTERS_FILTER}'
      value: ''
      description: Regex (case-insensitive) para filtrar counters descobertos. Vazio
        = todos.
    - macro: '{$NIFI.STATUS_NS_TRIGGER}'
      value: 3m
      description: 'Ciclos/periodo com API down antes do trigger (com unidade, ex.:
        3m).'
    - macro: '{$NIFI.THREADS_MAX}'
      value: '0'
      description: Total de threads ativas para trigger (0 = desativado).
    - macro: '{$NIFI.VERIFY_HOST}'
      value: '1'
      description: Validar host/SSL do endpoint (1=sim, 0=nao).
    items:
    - uuid: 28c9881441aa46dc8d13236a9cfb6ea5
      key: nifi.api.status
      name: 'NiFi API: Status do servico'
      type: HTTP_AGENT
      value_type: CHAR
      history: 1d
      trends: '0'
      request_method: GET
      url: '{$NIFI.URL}/flow/status'
      headers:
      - name: Content-Type
        value: application/json
      - name: Authorization
        value: Bearer {$NIFI.TOKEN}
      timeout: '{$NIFI.TIMEOUT}'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nvar c = body.controllerStatus;\nif (!c)\
          \ { throw 'NiFi API: resposta inesperada'; }\nreturn JSON.stringify({\n\
          \  'status': 'ok',\n  'active_threads': c.activeThreadCount != null ? c.activeThreadCount\
          \ : 0,\n  'queued': c.flowFilesQueued != null ? c.flowFilesQueued : 0,\n\
          \  'queued_bytes': c.bytesQueued != null ? c.bytesQueued : 0,\n  'running':\
          \ c.runningCount != null ? c.runningCount : 0,\n  'invalid': c.invalidCount\
          \ != null ? c.invalidCount : 0\n});\n"
      triggers:
      - uuid: c924980ec265467b83e9438b69182a83
        expression: nodata(/Apache NiFi API by JS/nifi.api.status,{$NIFI.STATUS_NS_TRIGGER})=1
        name: 'NiFi API: sem dados (servico indisponivel)'
        priority: HIGH
        description: A API do NiFi nao respondeu nos ultimos {$NIFI.STATUS_NS_TRIGGER}
          minutos.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
    - uuid: c9a9d88eeecf43f7bf5b299a482fb8b2
      key: nifi.api.bullets
      name: 'NiFi API: Bullets do UI (warnings/errors)'
      type: HTTP_AGENT
      value_type: TEXT
      history: 1d
      trends: '0'
      request_method: GET
      url: '{$NIFI.URL}/flow/bulletin-board'
      timeout: '{$NIFI.TIMEOUT}'
      preprocessing:
      - type: JAVASCRIPT
        error_handler: DISCARD_VALUE
        parameters:
        - |
          var body = JSON.parse(value);
          var lista = (body.bulletinBoard && body.bulletinBoard.bulletins) ? body.bulletinBoard.bulletins : [];
          var warn = 0, err = 0, semPermissao = 0, last = '';
          lista.forEach(function (e) {
            if (!e.bulletin) { semPermissao++; return; }
            var lvl = String(e.bulletin.level || '').toUpperCase();
            if (lvl === 'WARNING' || lvl === 'WARN') { warn++; }
            if (lvl === 'ERROR') {
              err++;
              if (!last) { last = (e.bulletin.sourceName || '') + ': ' + String(e.bulletin.message || '').substring(0, 200); }
            }
          });
          return JSON.stringify({ warn: warn, error: err, sem_permissao: semPermissao, last_error: last });
      headers:
      - name: Authorization
        value: Bearer {$NIFI.TOKEN}
      triggers:
      - uuid: 89da7e9fa1124c408e52b42d998bf773
        status: DISABLED
        expression: find(/Apache NiFi API by JS/nifi.api.bullets,5m,"like","\"error\":{$NIFI.BULLETS_ERROR}")=1
        name: 'NiFi: bullets de ERROR no bulletin board'
        priority: AVERAGE
        description: 'DESATIVADA (TO-BE): substituida pela trigger do item nifi.api.bullets.error,
          que reconhece de 2 a 9 erros. A busca textual com "like" nao casava com
          quantidades de 2+ algarismos.'
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    - uuid: 49a500a6d31f4f51bfaeb8a45a2e7c87
      key: nifi.api.bullets.error
      name: 'NiFi: bulletins ERROR'
      type: DEPENDENT
      value_type: UNSIGNED
      history: 31d
      trends: 400d
      master_item:
        key: nifi.api.bullets
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.error
      triggers:
      - uuid: ae7c1b59c69d4e6ea1ad6fcca3b8c3e9
        expression: last(/Apache NiFi API by JS/nifi.api.bullets.error)>={$NIFI.BULLETS_ERROR}
        name: 'NiFi: boletins ERROR no bulletin board'
        priority: AVERAGE
        description: 'Existem {$NIFI.BULLETS_ERROR} ou mais boletins de ERROR no bulletin
          board do NiFi (contador numerico do item dependente).'
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    - uuid: 139dd8cf1f7545a7abbd05274e5e9bc4
      key: nifi.api.token
      name: 'NiFi API: Token de acesso (login)'
      type: HTTP_AGENT
      value_type: CHAR
      history: '0'
      trends: '0'
      delay: 1h
      request_method: POST
      post_type: RAW
      posts: username={$NIFI.USER}&password={$NIFI.PASSWORD}
      url: '{$NIFI.URL}/access/token'
      timeout: '{$NIFI.TIMEOUT}'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var v = value.trim().replace(/\n/g, '''');

          if (!v || v.length < 20) { throw ''Login NiFi falhou: resposta invalida'';
          }

          return v;

          '
      authtype: NONE
      headers:
      - name: Content-Type
        value: application/x-www-form-urlencoded
      status_codes: '201'
      description: 'Faz login no NiFi (1x por hora, evita bloqueio da conta no AD
        por tentativas repetidas — TO-BE 1.4). Token obtido e valido para diagnostico;
        o token em uso vem de {$NIFI.TOKEN} renovado pelo playbook renovar_nifi_token.'
    - uuid: 3c79e1861ec84cb58fdcba2841703da3
      key: nifi.token.renovado
      name: 'NiFi: token renovado (sinal do playbook)'
      type: TRAP
      value_type: UNSIGNED
      history: 31d
      trends: 400d
      description: 'O cron/playbook renovar_nifi_token envia 1 apos cada renovacao:
        zabbix_sender -z <servidor-zabbix> -s <host> -k nifi.token.renovado -o 1.
        Execute o playbook para cada host NiFi (um token por instancia — TO-BE). Se
        o sinal faltar por 8h, a renovacao falhou e a coleta em Bearer {$NIFI.TOKEN}
        vai parar.'
      triggers:
      - uuid: e328d43892e64ec19cb0a0450a5047d5
        expression: nodata(/Apache NiFi API by JS/nifi.token.renovado,8h)=1
        name: 'NiFi: renovacao do token falhou (sem sinal do playbook)'
        priority: HIGH
        description: 'Nenhum sinal do playbook renovar_nifi_token nos ultimos 8h.
          O cron pode ter falhado e a coleta por token vira "API indisponivel" em
          breve.'
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
    - uuid: 6ad541e319a14677878807b7dfd08a1e
      key: nifi.fluxos.status
      name: 'NiFi: status dos fluxos'
      type: HTTP_AGENT
      value_type: TEXT
      history: 1d
      trends: '0'
      delay: 1m
      request_method: GET
      url: '{$NIFI.URL}/flow/process-groups/{$NIFI.ROOT_PG_ID}/status?recursive=true'
      timeout: 60s
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          // Codigo 5 — status dos fluxos (alteracoes 9/10 do DBT-6131 / TO-BE AMCOM)
          // Entrada: GET {$NIFI.URL}/flow/process-groups/{$NIFI.ROOT_PG_ID}/status?recursive=true
          // Saida:   lista JSON com um bloco por "fluxo" (Process Group na profundidade
          //          {$NIFI.FLUXO.PROFUNDIDADE}); os contadores de PROCESSADORES/FILAS de cada
          //          fluxo acumulam o subgrupo inteiro (TO-BE 1.3) — os "fluxos" com metricas
          //          de janela 5m (in/out) usam o aggregateSnapshot proprio, que o NiFi ja
          //          agrega por arvore.
          // Portas de entrada/saida sao ignoradas de proposito: portas sem conexao aparecem
          // como "invalidas" no NiFi, mas nao indicam falha (35 falsos positivos no HML).
          // Compativel com NiFi 1.x (campos flat + versionedFlowState) e 2.x (comps
          // "{id, ...StatusSnapshot}", sem versionedFlowState no status).
          // '{$NIFI.FLUXO.PROFUNDIDADE}' e substituida pelo Zabbix antes da execucao;
          // se nao resolver, parseInt falha e o padrao 1 (do template) e usado.

          var prof = parseInt('{$NIFI.FLUXO.PROFUNDIDADE}', 10);
          if (isNaN(prof) || prof < 0) { prof = 1; }

          var entity = JSON.parse(value);
          var root = entity && (entity.processGroupStatus || entity);
          if (!root || (!root.id && !root.aggregateSnapshot)) { throw 'NiFi: resposta inesperada de /flow/process-groups/*/status'; }

          function num(v) { var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
          function flt(v) { var f = parseFloat(v); return isNaN(f) ? 0 : f; }
          function rnd2(x) { return Math.round(x * 100) / 100; }
          function desempacota(e) {
            if (!e) { return {}; }
            return e.processorStatusSnapshot || e.connectionStatusSnapshot || e.processGroupStatusSnapshot || e.remoteProcessGroupStatusSnapshot || e;
          }
          function snap(d) { return (d && (d.aggregateSnapshot || d)) || {}; }

          function bytesDe(txt) {
            var m = String(txt || '').match(/([\d.,]+)\s*(B|KB|MB|GB|TB)/i);
            if (!m) { return 0; }
            var f = parseFloat(m[1].replace(',', '.'));
            if (isNaN(f)) { return 0; }
            var mult = { B: 1, KB: 1024, MB: 1048576, GB: 1073741824, TB: 1099511627776 };
            return Math.round(f * mult[m[2].toUpperCase()]);
          }

          function usoFila(c) {
            var qO = c.flowFilesQueued != null ? num(c.flowFilesQueued)
              : (c.queuedCount != null ? num(c.queuedCount)
              : (typeof c.queued === 'number' ? c.queued : num(String(c.queued || '').split(' ')[0])));
            var qB = c.bytesQueued != null ? num(c.bytesQueued)
              : (c.queuedBytes != null ? num(c.queuedBytes)
              : (typeof c.queuedSize === 'number' ? num(c.queuedSize) : bytesDe(c.queued)));
            var thO = num(c.backPressureObjectThreshold);
            var thB = num(c.backPressureBytesThreshold);
            var u1 = c.percentUseCount != null ? flt(c.percentUseCount) : (thO > 0 ? 100 * qO / thO : 0);
            var u2 = c.percentUseBytes != null ? flt(c.percentUseBytes) : (thB > 0 ? 100 * qB / thB : 0);
            return { pct: Math.max(u1, u2), qO: qO, qB: qB };
          }

          function msDe(p) {
            if (p.taskDurationNanos != null) { return num(p.taskDurationNanos) / 1000000; }
            if (p.tasksDurationNanos != null) { return num(p.tasksDurationNanos) / 1000000; }
            if (p.taskDurationMillis != null) { return num(p.taskDurationMillis); }
            if (p.taskMillis != null) { return num(p.taskMillis); }
            return 0;
          }
          function tasksDe(p) {
            if (p.taskCount != null) { return num(p.taskCount); }
            if (p.invoked != null) { return num(p.invoked); }
            return 0;
          }

          var rows = [];

          function coletar(dto, depth) {
            var s = snap(dto);
            var acc = {
              id: dto && dto.id != null ? String(dto.id) : String(s.id || ''),
              nome: String((dto && dto.name) || s.name || ''),
              profundidade: depth,
              stopped: 0,
              invalid: 0,
              max_uso_fila_pct: 0,
              conexoes_contrapressao: 0,
              fila_flowfiles: 0,
              fila_bytes: 0,
              pgs_com_deriva: 0,
              flowfiles_in_5min: 0,
              flowfiles_out_5min: 0,
              bytes_in_5min: 0,
              bytes_out_5min: 0,
              threads_ativas: 0,
              tarefas_ms_5min: 0,
              proc_mais_lento: '',
              proc_mais_lento_ms_por_tarefa: 0,
              versionamento: ''
            };

            var estado = String(s.versionedFlowState || (dto && dto.versionedFlowState) || '');
            if (estado !== '' && estado.toUpperCase() !== 'UP_TO_DATE') { acc.pgs_com_deriva = 1; }
            acc.versionamento = estado;

            var temProc = false;
            (s.processorStatusSnapshots || []).forEach(function (e) {
              var p = desempacota(e);
              temProc = true;
              var st = String(p.runStatus || p.state || '').toUpperCase();
              if (st === 'STOPPED' || st === 'STOPPING') { acc.stopped++; }
              if (st === 'INVALID') { acc.invalid++; }
              acc.threads_ativas += num(p.activeThreadCount);
              var ms = msDe(p);
              var tz = tasksDe(p);
              acc.tarefas_ms_5min += ms;
              if (tz > 0 && ms > 0 && (ms / tz) > acc.proc_mais_lento_ms_por_tarefa) {
                acc.proc_mais_lento_ms_por_tarefa = ms / tz;
                acc.proc_mais_lento = String(p.name || p.id || '');
              }
            });

            (s.connectionStatusSnapshots || []).forEach(function (e) {
              var c = desempacota(e);
              var u = usoFila(c);
              acc.fila_flowfiles += u.qO;
              acc.fila_bytes += u.qB;
              if (u.pct > acc.max_uso_fila_pct) { acc.max_uso_fila_pct = u.pct; }
              if (u.pct >= 100) { acc.conexoes_contrapressao++; }
            });

            // O aggregateSnapshot de cada PG ja agrega a subarvore inteira (NiFi 2.x e 1.x
            // recursive): filas, in/out 5m, threads e tempo de processamento vem do proprio
            // snapshot; se o campo nao existir na versao em uso, caimos na soma da subarvore.
            var temQ = (s.flowFilesQueued != null || s.queuedCount != null);
            var temQB = (s.bytesQueued != null);
            var temThr = (s.activeThreadCount != null);
            var temNanos = (s.processingNanos != null);

            acc.flowfiles_in_5min = num(s.flowFilesIn);
            acc.flowfiles_out_5min = num(s.flowFilesOut);
            acc.bytes_in_5min = num(s.bytesIn);
            acc.bytes_out_5min = num(s.bytesOut);
            if (temQ) { acc.fila_flowfiles = num(s.flowFilesQueued != null ? s.flowFilesQueued : s.queuedCount); }
            if (temQB) { acc.fila_bytes = num(s.bytesQueued); }
            if (temThr) { acc.threads_ativas = num(s.activeThreadCount) + num(s.statelessActiveThreadCount); }
            if (temNanos) { acc.tarefas_ms_5min = num(s.processingNanos) / 1000000; }

            (s.processGroupStatusSnapshots || s.groupStatusSnapshots || []).forEach(function (e) {
              var sub = coletar(desempacota(e), depth + 1);
              acc.stopped += sub.stopped;
              acc.invalid += sub.invalid;
              acc.max_uso_fila_pct = Math.max(acc.max_uso_fila_pct, sub.max_uso_fila_pct);
              acc.conexoes_contrapressao += sub.conexoes_contrapressao;
              if (!temQ) { acc.fila_flowfiles += sub.fila_flowfiles; }
              if (!temQB) { acc.fila_bytes += sub.fila_bytes; }
              acc.pgs_com_deriva += sub.pgs_com_deriva;
              if (!temThr) { acc.threads_ativas += sub.threads_ativas; }
              if (!temNanos) { acc.tarefas_ms_5min += sub.tarefas_ms_5min; }
              if (sub.proc_mais_lento_ms_por_tarefa > acc.proc_mais_lento_ms_por_tarefa) {
                acc.proc_mais_lento_ms_por_tarefa = sub.proc_mais_lento_ms_por_tarefa;
                acc.proc_mais_lento = sub.proc_mais_lento;
              }
            });

            if (prof === 0 || depth === prof) {
              rows.push({
                id: acc.id,
                nome: acc.nome,
                profundidade: depth,
                stopped: acc.stopped,
                invalid: acc.invalid,
                max_uso_fila_pct: rnd2(acc.max_uso_fila_pct),
                conexoes_contrapressao: acc.conexoes_contrapressao,
                fila_flowfiles: acc.fila_flowfiles,
                fila_bytes: acc.fila_bytes,
                pgs_com_deriva: acc.pgs_com_deriva,
                flowfiles_in_5min: acc.flowfiles_in_5min,
                flowfiles_out_5min: acc.flowfiles_out_5min,
                bytes_in_5min: acc.bytes_in_5min,
                bytes_out_5min: acc.bytes_out_5min,
                threads_ativas: acc.threads_ativas,
                tarefas_ms_5min: Math.round(acc.tarefas_ms_5min),
                proc_mais_lento: acc.proc_mais_lento,
                proc_mais_lento_ms_por_tarefa: rnd2(acc.proc_mais_lento_ms_por_tarefa),
                versionamento: acc.versionamento
              });
            }

            return acc;
          }

          coletar(root, 0);
          return JSON.stringify(rows);
      headers:
      - name: Authorization
        value: Bearer {$NIFI.TOKEN}
      triggers:
      - uuid: 2761bae8d8b3448ab6773498048eaca8
        expression: nodata(/Apache NiFi API by JS/nifi.fluxos.status,5m)=1
        name: 'NiFi: coleta dos fluxos parou'
        priority: HIGH
        description: 'O item mestre da descoberta de fluxos (recursive=true) nao
          respondeu em 5m ou devolveu JSON invalido.'
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
    discovery_rules:
    - uuid: 551ea9d137aa43ae893db21c913517b3
      status: DISABLED
      key: nifi.discovery.process_groups
      name: Descoberta de Process Groups
      type: HTTP_AGENT
      request_method: GET
