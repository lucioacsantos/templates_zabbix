zabbix_export:
  version: '7.4'
  templates:
  - uuid: 20ef1da317484076ab7ac8ca26f5e835
    template: Apache NiFi API by JS
    name: Apache NiFi API by JS
    description: 'Template master para monitoramento do Apache NiFi via API REST (/flow,
      /controller, /counters).

      Coleta e processamento com JavaScript embutido (item HTTP + preprocessing JS),
      sem agente.


      Autenticacao: os itens usam HTTP Basic com {$NIFI.USER}/{$NIFI.PASSWORD} (NiFi
      aceita Basic nas APIs).

      O item "NiFi API: Token de acesso" faz POST em {$NIFI.URL}/access/token e registra
      o token gerado

      (uso em scripts/webhooks; as demais chamadas seguem com Basic).


      A LLD descobre Process Groups (via /flow/process-groups/{root}) ou usa {$NIFI.PROCESS_GROUPS}.

      Templates dependentes: recursos (JVM/cluster/storage), filas (back pressure)
      e counters.


      Requer Zabbix Server/Proxy >= 7.4 e conectividade HTTP(S) ate a API do NiFi.'
    groups:
    - name: Templates
    macros:
    - macro: '{$NIFI.URL}'
      value: https://nifi.exemplo.com:8443/nifi-api
      description: 'URL base da API REST do NiFi (sem barra final). Ex.: https://host:8443/nifi-api'
    - macro: '{$NIFI.USER}'
      value: ''
      description: Usuario para autenticacao Basic. Vazio = sem autenticacao.
    - macro: '{$NIFI.PASSWORD}'
      type: SECRET_TEXT
      description: Senha para autenticacao Basic.
    - macro: '{$NIFI.TOKEN}'
      type: SECRET_TEXT
      description: 'Token de acesso do NiFi. Preencha com um token de longa duracao
        OU deixe vazio e use {$NIFI.USER}/{$NIFI.PASSWORD}: o item de login obtera
        o token em {$NIFI.URL}/access/token e guardara no valor do item.'
    - macro: '{$NIFI.AUTH}'
      value: basic
      description: 'Modo de autenticacao: basic (login automatico via {$NIFI.USER}/{$NIFI.PASSWORD}
        em /access/token, token armazenado em {$NIFI.TOKEN}) ou token (usa {$NIFI.TOKEN}
        direto).'
    - macro: '{$NIFI.ROOT_PG_ID}'
      value: root
      description: ID do Process Group raiz (ou "root").
    - macro: '{$NIFI.PROCESS_GROUPS}'
      value: ''
      description: Lista estatica de IDs de Process Groups separados por virgula.
        Vazio = descobrir via API.
    - macro: '{$NIFI.TIMEOUT}'
      value: 15s
      description: 'Timeout das requisicoes HTTP (com unidade, ex.: 15s ou {$X}s).'
    - macro: '{$NIFI.RETRIES}'
      value: '2'
      description: Tentativas extras em caso de falha.
    - macro: '{$NIFI.QUEUE_BACKPRESSURE_PCT}'
      value: '80'
      description: '% do back pressure (object/bytes threshold) para trigger de fila
        saturada.'
    - macro: '{$NIFI.QUEUE_AGE_MIN}'
      value: '300'
      description: Idade maxima (s) do dado mais antigo na fila antes do trigger.
    - macro: '{$NIFI.BULLETS_WARN}'
      value: '0'
      description: Quantidade de bullets em WARNING para trigger.
    - macro: '{$NIFI.BULLETS_ERROR}'
      value: '1'
      description: Quantidade de bullets em ERROR para trigger.
    - macro: '{$NIFI.PROC_STOPPED}'
      value: '0'
      description: Processadores stopped/invalid/disabled tolerados antes do trigger
        (>=).
    - macro: '{$NIFI.GC_PCT}'
      value: '80'
      description: '% de tempo em GC da JVM para trigger.'
    - macro: '{$NIFI.HEAP_PCT}'
      value: '85'
      description: '% de heap da JVM para trigger.'
    - macro: '{$NIFI.COUNTERS_FILTER}'
      value: ''
      description: Regex (case-insensitive) para filtrar counters descobertos. Vazio
        = todos.
    - macro: '{$NIFI.STATUS_NS_TRIGGER}'
      value: 3m
      description: 'Ciclos/periodo com API down antes do trigger (com unidade, ex.:
        3m).'
    - macro: '{$NIFI.THREADS_MAX}'
      value: '0'
      description: Total de threads ativas para trigger (0 = desativado).
    - macro: '{$NIFI.VERIFY_HOST}'
      value: '1'
      description: Validar host/SSL do endpoint (1=sim, 0=nao).
    items:
    - uuid: 28c9881441aa46dc8d13236a9cfb6ea5
      key: nifi.api.status
      name: 'NiFi API: Status do servico'
      type: HTTP_AGENT
      value_type: CHAR
      history: 7d
      trends: '0'
      request_method: GET
      url: '{$NIFI.URL}/flow/status'
      headers:
      - name: Content-Type
        value: application/json
      - name: Authorization
        value: Bearer {$NIFI.TOKEN}
      timeout: '{$NIFI.TIMEOUT}'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nvar c = body.controllerStatus;\nif (!c)\
          \ { throw 'NiFi API: resposta inesperada'; }\nreturn JSON.stringify({\n\
          \  'status': 'ok',\n  'active_threads': c.activeThreadCount != null ? c.activeThreadCount\
          \ : 0,\n  'queued': c.flowFilesQueued != null ? c.flowFilesQueued : 0,\n\
          \  'queued_bytes': c.bytesQueued != null ? c.bytesQueued : 0,\n  'running':\
          \ c.runningCount != null ? c.runningCount : 0,\n  'invalid': c.invalidCount\
          \ != null ? c.invalidCount : 0\n});\n"
      triggers:
      - uuid: c924980ec265467b83e9438b69182a83
        expression: nodata(/Apache NiFi API by JS/nifi.api.status,{$NIFI.STATUS_NS_TRIGGER})=1
        name: 'NiFi API: sem dados (servico indisponivel)'
        priority: HIGH
        description: A API do NiFi nao respondeu nos ultimos {$NIFI.STATUS_NS_TRIGGER}
          minutos.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
    - uuid: c9a9d88eeecf43f7bf5b299a482fb8b2
      key: nifi.api.bullets
      name: 'NiFi API: Bullets do UI (warnings/errors)'
      type: HTTP_AGENT
      value_type: TEXT
      history: 7d
      trends: '0'
      request_method: GET
      url: '{$NIFI.URL}/flow/bulletin-board'
      timeout: '{$NIFI.TIMEOUT}'
      preprocessing:
      - type: JAVASCRIPT
        error_handler: DISCARD_VALUE
        parameters:
        - "var body = JSON.parse(value);\nvar bullets = (body.bulletin && body.bulletin.bulletins)\
          \ ? body.bulletin.bulletins : [];\nvar warn = 0;\nvar err = 0;\nvar last\
          \ = '';\nvar sev = ['WARN', 'ERROR'];\nbullets.forEach(function (b) {\n\
          \  if (b.groupWeight && b.groupWeight > 0) {\n    var level = (b.bulletin\
          \ && b.bulletin.level) ? b.bulletin.level.toUpperCase() : '';\n    if (level\
          \ === 'WARN') { warn++; }\n    if (level === 'ERROR') { err++; }\n    if\
          \ (!last && level === 'ERROR') { last = (b.bulletin.message || '').substring(0,\
          \ 200); }\n  }\n});\nreturn JSON.stringify({ 'warn': warn, 'error': err,\
          \ 'last_error': last });\n"
      triggers:
      - uuid: 89da7e9fa1124c408e52b42d998bf773
        expression: find(/Apache NiFi API by JS/nifi.api.bullets,5m,"like","\"error\":{$NIFI.BULLETS_ERROR}")=1
        name: 'NiFi: bullets de ERROR no bulletin board'
        priority: AVERAGE
        description: Existem {$NIFI.BULLETS_ERROR} ou mais boletins de ERROR no NiFi
          (verificar item nifi.api.bullets).
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
      headers:
      - name: Authorization
        value: Bearer {$NIFI.TOKEN}
    - uuid: 139dd8cf1f7545a7abbd05274e5e9bc4
      key: nifi.api.token
      name: 'NiFi API: Token de acesso (login)'
      type: HTTP_AGENT
      value_type: CHAR
      history: '0'
      trends: '0'
      request_method: POST
      post_type: RAW
      posts: username={$NIFI.USER}&password={$NIFI.PASSWORD}
      url: '{$NIFI.URL}/access/token'
      timeout: '{$NIFI.TIMEOUT}'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var v = value.trim().replace(/\n/g, '''');

          if (!v || v.length < 20) { throw ''Login NiFi falhou: resposta invalida'';
          }

          return v;

          '
      authtype: NONE
      headers:
      - name: Content-Type
        value: application/x-www-form-urlencoded
      status_codes: '201'
    discovery_rules:
    - uuid: 551ea9d137aa43ae893db21c913517b3
      key: nifi.discovery.process_groups
      name: Descoberta de Process Groups
      type: HTTP_AGENT
      request_method: GET
      url: '{$NIFI.URL}/flow/process-groups/{$NIFI.ROOT_PG_ID}'
      timeout: '{$NIFI.TIMEOUT}'
      delay: 1h
      lifetime: 30d
      description: Descobre Process Groups filhos do grupo raiz (ou usa {$NIFI.PROCESS_GROUPS}).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nvar flow = (body.processGroupFlow && body.processGroupFlow.flow)\
          \ ? body.processGroupFlow.flow : null;\nvar rootId = body.processGroupFlow\
          \ ? body.processGroupFlow.id : '{$NIFI.ROOT_PG_ID}';\nvar groups = flow\
          \ ? (flow.processGroups || []) : [];\nvar rows = [];\ngroups.forEach(function\
          \ (g) {\n  var comp = g.component ? g.component : g;\n  if (!comp.id) {\
          \ return; }\n  rows.push({ '{#PGID}': comp.id, '{#PGNAME}': comp.name ||\
          \ comp.id, '{#PGPATH}': '/' });\n});\nif (!rows.length) {\n  rows.push({\
          \ '{#PGID}': rootId, '{#PGNAME}': 'root', '{#PGPATH}': '/' });\n}\nreturn\
          \ JSON.stringify({ 'data': rows });\n"
      item_prototypes:
      - uuid: dc270c31b61644c58b8199a57cae82ed
        key: nifi.pg.status[{#PGID}]
        name: 'PG {#PGNAME}: Status (raw)'
        type: HTTP_AGENT
        value_type: TEXT
        history: 1d
        trends: '0'
        request_method: GET
        url: '{$NIFI.URL}/flow/process-groups/{#PGID}/status'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus;

            return JSON.stringify(s.aggregateSnapshot || s);

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: f1a50b3afd8944e5b3766fe0396f3a20
        key: nifi.pg.threads[{#PGID}]
        name: 'PG {#PGNAME}: Threads ativas'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        units: threads
        request_method: GET
        url: '{$NIFI.URL}/flow/process-groups/{#PGID}/status'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus.aggregateSnapshot;

            return parseInt((s.activeThreadCount != null ? s.activeThreadCount : 0),
            10) || 0;

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: e67e3e0d91b64bb3a011fa9846157d33
        key: nifi.pg.queued_count[{#PGID}]
        name: 'PG {#PGNAME}: Filas - objetos em fila'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        request_method: GET
        url: '{$NIFI.URL}/flow/process-groups/{#PGID}/status'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus.aggregateSnapshot;

            return parseInt(s.queuedCount, 10) || 0;

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: e6d920b681b84ec5a5e67c17893f719d
        key: nifi.pg.queued_bytes[{#PGID}]
        name: 'PG {#PGNAME}: Filas - bytes em fila'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        units: B
        request_method: GET
        url: '{$NIFI.URL}/flow/process-groups/{#PGID}/status'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus.aggregateSnapshot;

            return parseInt(s.bytesQueued, 10) || 0;

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: a7e2849776994699812d9d9a7ae7bb03
        key: nifi.pg.flowfiles_in[{#PGID}]
        name: 'PG {#PGNAME}: FlowFiles in (5m)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        units: '!/s'
        request_method: GET
        url: '{$NIFI.URL}/flow/process-groups/{#PGID}/status'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus.aggregateSnapshot;

            return parseInt(s.flowFilesQueued, 10) || 0;

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: 5632af655fb74ca8a6607f783382913c
        key: nifi.pg.flowfiles_out[{#PGID}]
        name: 'PG {#PGNAME}: FlowFiles out (5m)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        units: '!/s'
        request_method: GET
        url: '{$NIFI.URL}/flow/process-groups/{#PGID}/status'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus.aggregateSnapshot;

            return parseInt(s.flowFilesTransferred, 10) || 0;

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: 4cd2aac3ba7d4964a8a3be20208588d2
        key: nifi.pg.bytes_read[{#PGID}]
        name: 'PG {#PGNAME}: Bytes lidos (5m)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        units: Bps
        request_method: GET
        url: '{$NIFI.URL}/flow/process-groups/{#PGID}/status'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus.aggregateSnapshot;

            return parseInt(s.bytesRead, 10) || 0;

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: 5da89b556fcd4909a2c25e689041be94
        key: nifi.pg.bytes_written[{#PGID}]
        name: 'PG {#PGNAME}: Bytes escritos (5m)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        units: Bps
        request_method: GET
        url: '{$NIFI.URL}/flow/process-groups/{#PGID}/status'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus.aggregateSnapshot;

            return parseInt(s.bytesWritten, 10) || 0;

            '
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: b7f6b5eb7eeb4801b3921e5a488a4aaa
        key: nifi.pg.proc_errors[{#PGID}]
        name: 'PG {#PGNAME}: Processadores com erro/stopped'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        request_method: GET
        url: '{$NIFI.URL}/flow/process-groups/{#PGID}'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - "var body = JSON.parse(value);\nvar procs = (body.processGroupFlow &&\
            \ body.processGroupFlow.flow && body.processGroupFlow.flow.processors)\n\
            \  ? body.processGroupFlow.flow.processors : [];\nvar bad = 0;\nvar BAD\
            \ = ['INVALID', 'DISABLED', 'STOPPED'];\nprocs.forEach(function (p) {\n\
            \  var st = (p.component && p.component.state) ? p.component.state.toUpperCase()\
            \ : '';\n  var needs = p.component && (p.component.validationErrors ||\
            \ []).length > 0;\n  if (st === 'INVALID' || needs) { bad++; }\n});\n\
            return bad;\n"
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      - uuid: 8df38c3c1ab94e4895ab8b5acfe6d2ac
        key: nifi.pg.uptime[{#PGID}]
        name: 'PG {#PGNAME}: Uptime dos processadores (s)'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        units: s
        request_method: GET
        url: '{$NIFI.URL}/flow/process-groups/{#PGID}'
        timeout: '{$NIFI.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - "var body = JSON.parse(value);\nvar procs = (body.processGroupFlow &&\
            \ body.processGroupFlow.flow && body.processGroupFlow.flow.processors)\n\
            \  ? body.processGroupFlow.flow.processors : [];\nvar max = 0;\nvar now\
            \ = Date.now();\nprocs.forEach(function (p) {\n  if (p.component && p.component.state\
            \ === 'RUNNING' && p.status && p.status.statsSnapshot) {\n    var st =\
            \ p.status.statsSnapshot;\n    var up = st.uptime ? parseInt(st.uptime,\
            \ 10) : 0;\n    if (up > max) { max = up; }\n  }\n});\nreturn max;\n"
        headers:
        - name: Authorization
          value: Bearer {$NIFI.TOKEN}
      trigger_prototypes:
      - uuid: c7de480d6d2e4942b50e8eecab1837ac
        expression: nodata(/Apache NiFi API by JS/nifi.pg.status[{#PGID}],{$NIFI.STATUS_NS_TRIGGER})=1
        name: 'PG {#PGNAME}: sem dados da API'
        priority: WARNING
        description: Process Group {#PGNAME} ({#PGID}) nao respondeu via API.
        manual_close: 'YES'
        tags:
        - tag: processgroup
          value: '{#PGNAME}'
        - tag: scope
          value: availability
      - uuid: 80d897ef1b1440529796fc3fc4c6bf3c
        expression: min(/Apache NiFi API by JS/nifi.pg.proc_errors[{#PGID}],10m)>{$NIFI.PROC_STOPPED}
        name: 'PG {#PGNAME}: processadores invalidos/parados'
        priority: AVERAGE
        description: Existem processadores invalidos ou com erros de validacao no
          PG {#PGNAME}.
        manual_close: 'YES'
        tags:
        - tag: processgroup
          value: '{#PGNAME}'
        - tag: scope
          value: availability
      lld_macro_paths:
      - lld_macro: '{#PGID}'
        path: $.pgid
      - lld_macro: '{#PGNAME}'
        path: $.pgname
      - lld_macro: '{#PGPATH}'
        path: $.pgpath
      headers:
      - name: Authorization
        value: Bearer {$NIFI.TOKEN}
    tags:
    - tag: class
      value: software
    - tag: target
      value: nifi
    - tag: target
      value: dataflow
    valuemaps:
    - uuid: b59c4efeed134ff3bfe1bcbc79a52fc8
      name: NiFi API status
      mappings:
      - value: ok
        newvalue: Servico OK
      - value: down
        newvalue: Servico DOWN
    vendor:
      name: Internal
      version: '1.0'
  - uuid: d9239f5ca8d54ae7820f4b051b95c26a
    template: Apache NiFi API by JS Cluster Resources
    name: Apache NiFi API by JS Cluster Resources
    description: 'Coleta de recursos do cluster NiFi:

      - JVM: heap usado/max, % de heap, GC time %, threads, uptime

      - Storage: espaco livre/usado por repository (flowfile/content/provenance)

      - Cluster: nodes, eleicao de lider, total de threads

      '
    groups:
    - name: Templates
    items:
    - uuid: d66266c86080477e902ef27193b27375
      key: nifi.jvm.raw
      name: 'NiFi JVM: Status (raw)'
      type: HTTP_AGENT
      value_type: TEXT
      history: 1d
      trends: '0'
      request_method: GET
      url: '{$NIFI.URL}/system-diagnostics'
      timeout: '{$NIFI.TIMEOUT}'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var body = JSON.parse(value);

          return JSON.stringify(body.systemDiagnostics.aggregateSnapshot);

          '
      headers:
      - name: Authorization
        value: Bearer {$NIFI.TOKEN}
    - uuid: a0198e3df6284f4ea2e04bc441308d97
      key: nifi.jvm.heap_used
      name: 'NiFi JVM: Heap usado'
      type: DEPENDENT
      value_type: UNSIGNED
      history: 7d
      trends: 30d
      units: B
      master_item:
        key: nifi.jvm.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var b = JSON.parse(value);

          return parseInt(b.usedHeapBytes, 10) || 0;

          '
    - uuid: b0f0ea4cf01e4abfa32afef13085ad4b
      key: nifi.jvm.heap_max
      name: 'NiFi JVM: Heap maximo'
      type: DEPENDENT
      value_type: UNSIGNED
      history: 7d
      trends: 30d
      units: B
      master_item:
        key: nifi.jvm.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var b = JSON.parse(value);

          return parseInt(b.maxHeapBytes, 10) || 0;

          '
    - uuid: b97f4927dd5840b389c7679ecea42347
      key: nifi.jvm.heap_pct
      name: 'NiFi JVM: Heap %'
      type: DEPENDENT
      value_type: FLOAT
      history: 7d
      trends: 30d
      units: '%'
      master_item:
        key: nifi.jvm.raw
      preprocessing:
      - type: JAVASCRIPT
        error_handler: DISCARD_VALUE
        parameters:
        - 'var b = JSON.parse(value);

          var used = parseInt(b.usedHeapBytes, 10) || 0;

          var max = parseInt(b.maxHeapBytes, 10) || 0;

          if (max <= 0) { return 0; }

          return Math.round(100 * used / max * 100) / 100;

          '
      triggers:
      - uuid: e07ea00a340f493fb71e4efb2156259e
        expression: min(/Apache NiFi API by JS Cluster Resources/nifi.jvm.heap_pct,5m)>{$NIFI.HEAP_PCT}
        name: 'NiFi JVM: heap > {$NIFI.HEAP_PCT}%'
        priority: WARNING
        description: Uso de heap da JVM do NiFi acima de {$NIFI.HEAP_PCT}%.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: performance
    - uuid: da9075df542f491e814920d2d041f62f
      key: nifi.jvm.uptime
      name: 'NiFi JVM: Uptime'
      type: DEPENDENT
      value_type: UNSIGNED
      history: 7d
      trends: 30d
      units: s
      master_item:
        key: nifi.jvm.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var b = JSON.parse(value);

          var u = String(b.uptime || ''00:00:00.000'');

          var p = u.split('':'');

          var s = parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]
          || 0);

          return Math.floor(s);

          '
    - uuid: 7395837cffcd4dfda0ef0cc386cf628e
