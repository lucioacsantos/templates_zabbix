---
- name: Stop Artifactory — PRODUÇÃO (pxcd01)
  hosts: pxcd01.energia.org.br
  become: true
  gather_facts: false

  tasks:
    - name: Stop artifactory
      ansible.builtin.command:
        cmd: ./artifactory.sh stop
        chdir: /opt/aplicacoes/artifactory/bin/bin
      async: 600
      poll: 5
      changed_when: true
      failed_when: false