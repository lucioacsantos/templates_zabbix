---
# Para utilização nos hwdc pwdc pwup
# Job configurado para executar um servidor por vez
- name: Atualizações Windows Server
  hosts: "{{ servidores }}"
  gather_facts: false
  vars:
    # Valor padrão caso 'servidores' não seja fornecido
    servidores: all
  tasks:
    - name: Iniciando download USOclient
      ansible.windows.win_shell: USOclient StartDownload
      register: updates
    
    - name: Debug
      ansible.builtin.debug:
        var: updates

