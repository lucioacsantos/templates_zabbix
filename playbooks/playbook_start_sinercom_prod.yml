---
- name: Sinercom — PRODUÇÃO (START)
  hosts: pxas02.energia.org.br
  become: true
  gather_facts: false

  tasks:
    - name: Start Sinercom (Components)
      ansible.builtin.command:
        cmd: ./Start_Run_Components
        chdir: /opt/aplicacoes/sinercom/tomcat/pxas02/scripts/
      become_user: root
      async: 600
      poll: 5
      changed_when: true
      failed_when: false

    - name: Start Sinercom (WEB)
      ansible.builtin.command:
        cmd: ./startWEB
        chdir: /opt/aplicacoes/sinercom/tomcat/pxas02/scripts/
      become_user: root
      async: 600
      poll: 5
      changed_when: true
      failed_when: false
