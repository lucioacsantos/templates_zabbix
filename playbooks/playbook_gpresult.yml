---
- name: Executar GPRESULT
  hosts: "{{ servidores }}"
  gather_facts: false
  vars:
    # Valor padrão caso 'servidores' não seja fornecido
    servidores: all
  tasks:
    - name: Executando comando gpresult /r
      ansible.windows.win_shell: gpresult /r
      register: result

    - name: Exibindo resultados
      debug:
        var: result.stdout_lines