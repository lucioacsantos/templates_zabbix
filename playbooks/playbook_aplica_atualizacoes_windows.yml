---
- name: Atualizações Windows Server
  hosts: "{{ servidores }}"
  gather_facts: false
  vars:
    # Valor padrão caso 'servidores' não seja fornecido
    servidores: all
  tasks:
    - name: Exibindo mensagem antes de aplicar atualizações e iniciar reboot
      ansible.builtin.debug:
        msg: "O host {{ inventory_hostname }} está aplicando atualizações e será reiniciado em breve."

    - name: Aplicando atualizações disponíveis
      ansible.windows.win_updates:
        category_names: '*'
        reboot: yes