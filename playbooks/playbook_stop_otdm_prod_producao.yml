---
- name: OTDM PRODUÇÃO/PRODUÇÃO
  hosts: localhost
  gather_facts: false

  vars_files:
    - vars/playbook_comandos_stop_otdm_prod_producao.yml
    - vars/playbook_comandos_stop_otdm_prod_lab.yml

  tasks:
    - name: PARADA DE SERVIÇOS
      block:
        - name: Parando serviços produção
          loop: "{{ comandos_producao }}"
          ansible.builtin.include_tasks:
            file: tasks/playbook_task_stop_java.yml
      when: ambiente == 'PROD'

    - name: Ambiente LAB
      block:
        - name: Parando serviços LAB
          loop: "{{ comandos_lab }}"
          ansible.builtin.include_tasks:
            file: tasks/playbook_task_stop_java.yml
      when: ambiente == 'LAB'