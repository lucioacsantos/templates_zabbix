- name: Stop de serviços Protheus - License Server PRODUÇÃO
  hosts: pxer05.energia.org.br
  become: true
  gather_facts: false
    
  tasks:
    - name: Parar serviço no pxer05
      ansible.builtin.systemd:
        name: licenseserver
        state: stopped
