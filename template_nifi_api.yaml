      trends: '0'
      request_method: GET
      url: '{$NIFI.URL}/controller/diagnostics'
      timeout: '{$NIFI.TIMEOUT}s'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nvar out = [];\nvar sys = (body.systemDiagnostics\
          \ && body.systemDiagnostics.aggregateSnapshots)\n  ? body.systemDiagnostics.aggregateSnapshots\
          \ : [];\nif (body.systemDiagnostics && body.systemDiagnostics.nodeSnapshots)\
          \ {\n  sys = body.systemDiagnostics.nodeSnapshots;\n}\n(Array.isArray(sys)\
          \ ? sys : [sys]).forEach(function (s) {\n  if (!s) { return; }\n  var st\
          \ = s.snapshot || s;\n  var repos = (st.repositoryStorageUsage) ? st.repositoryStorageUsage\
          \ : [];\n  repos.forEach(function (r) {\n    out.push({\n      'name': r.identifier\
          \ || r.name || 'repo',\n      'used': r.usedBytes || 0,\n      'free': r.freeBytes\
          \ || 0,\n      'limit': r.limitBytes || 0\n    });\n  });\n});\nreturn JSON.stringify({\
          \ 'repositories': out });\n"
    - uuid: ae0f1b2c3d4e6f6f708192a3b4c5d6e7f0
      key: nifi.storage.used_pct
      name: 'NiFi Storage: Uso maximo dos repositorios (%)'
      type: DEPENDENT
      value_type: FLOAT
      history: 7d
      trends: 30d
      units: '%'
      master_item:
        key: nifi.storage.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var b = JSON.parse(value);\nvar max = 0;\n(b.repositories || []).forEach(function\
          \ (r) {\n  if (r.limit > 0) {\n    var pct = 100 * r.used / r.limit;\n \
          \   if (pct > max) { max = pct; }\n  }\n});\nreturn max;\n"
      triggers:
      - uuid: af0f1b2c3d4e6f6f708192a3b4c5d6e7f0
        expression: min(/Apache NiFi API by JS Cluster Resources/nifi.storage.used_pct,5m)>{$NIFI.QUEUE_BACKPRESSURE_PCT}
        name: 'NiFi Storage: repositorio acima de {$NIFI.QUEUE_BACKPRESSURE_PCT}%'
        priority: WARNING
