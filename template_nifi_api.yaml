  - uuid: b1f0b2c3d4e6f6f708192a3b4c5d6e7f0
    template: Apache NiFi API by JS Queues
    name: Apache NiFi API by JS Queues
    description: 'Coleta de filas (connections) por Process Group descoberto:

      - Objetos e bytes em fila

      - % do back pressure (objetos e bytes)

      - Idade do dado mais antigo na fila (s)

      '
    groups:
    - name: Templates
    discovery_rules:
    - uuid: b2f0b2c3d4e6f6f708192a3b4c5d6e7f0
      key: nifi.discovery.queues
      name: Descoberta de filas por PG
      type: HTTP_AGENT
      request_method: GET
      url: '{$NIFI.URL}/flow/process-groups/{#PGID}'
      timeout: '{$NIFI.TIMEOUT}s'
      delay: 5m
      lifetime: 30d
      description: Depende da LLD de PGs do master (macro {#PGID}).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nvar conns = (body.processGroupFlow && body.processGroupFlow.flow\
          \ && body.processGroupFlow.flow.connections)\n  ? body.processGroupFlow.flow.connections\
          \ : [];\nvar rows = [];\nconns.forEach(function (c) {\n  if (!c.component)\
          \ { return; }\n  rows.push({\n    '{#PGID}': c.component.destination ? (c.component.destination.groupId\
          \ || '{#PGID}') : '{#PGID}',\n    '{#PGNAME}': c.component.destination ?\
          \ (c.component.destination.name || '{#PGNAME}') : '{#PGNAME}',\n    '{#CONNID}':\
          \ c.component.id,\n    '{#CONNNAME}': c.component.name || c.component.id,\n\
          \    '{#SRC}': c.component.source && c.component.source.name ? c.component.source.name\
          \ : ''\n  });\n});\nreturn JSON.stringify({ 'data': rows });\n"
      item_prototypes:
      - uuid: b3f0b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.queue.raw[{#CONNID}]
        name: 'Fila {#CONNNAME}: Status (raw)'
        type: HTTP_AGENT
        value_type: TEXT
        history: 1d
        trends: '0'
        request_method: GET
        url: '{$NIFI.URL}/flowfile-queues/{#CONNID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var q = body.flowFileQueueSnapshot || body;

            return JSON.stringify(q);

            '
      - uuid: b4f0b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.queue.objects[{#CONNID}]
        name: 'Fila {#CONNNAME}: Objetos em fila'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        request_method: GET
        url: '{$NIFI.URL}/flowfile-queues/{#CONNID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var b = JSON.parse(value);

            var q = b.flowFileQueueListing || b;

            var n = (q.totalCount != null) ? q.totalCount : ((q.listings && q.listings[0])
            ? q.listings[0].flowFileCount : 0);

            return parseInt(n, 10) || 0;

            '
      - uuid: b5f0b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.queue.bytes[{#CONNID}]
        name: 'Fila {#CONNNAME}: Bytes em fila'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        units: B
        request_method: GET
        url: '{$NIFI.URL}/flowfile-queues/{#CONNID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var b = JSON.parse(value);

            var q = b.flowFileQueueListing || b;

            var n = (q.byteCount != null) ? q.byteCount : ((q.listings && q.listings[0])
            ? q.listings[0].byteCount : 0);

            return parseInt(n, 10) || 0;

            '
      - uuid: b6f0b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.queue.bp_objects_pct[{#CONNID}]
        name: 'Fila {#CONNNAME}: Back pressure objetos (%)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        units: '%'
        request_method: GET
        url: '{$NIFI.URL}/flowfile-queues/{#CONNID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var b = JSON.parse(value);

            var q = b.flowFileQueueListing || b;

            var obj = parseInt((q.totalCount != null) ? q.totalCount : 0, 10) || 0;

            var bp = (q.backPressureObjectThreshold != null) ? parseInt(q.backPressureObjectThreshold,
            10) : 0;

            if (bp <= 0) { return 0; }

            return 100 * obj / bp;

            '
      - uuid: b8f0b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.queue.bp_bytes_pct[{#CONNID}]
        name: 'Fila {#CONNNAME}: Back pressure bytes (%)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        units: '%'
        request_method: GET
        url: '{$NIFI.URL}/flowfile-queues/{#CONNID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var b = JSON.parse(value);

            var q = b.flowFileQueueListing || b;

            var bytes = parseInt((q.byteCount != null) ? q.byteCount : 0, 10) || 0;

            var bp = (q.backPressureBytesThreshold != null) ? parseInt(q.backPressureBytesThreshold,
            10) : 0;

            if (bp <= 0) { return 0; }

            return 100 * bytes / bp;

            '
      - uuid: ba0f1b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.queue.oldest[{#CONNID}]
        name: 'Fila {#CONNNAME}: Idade do dado mais antigo (s)'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        units: s
        request_method: GET
        url: '{$NIFI.URL}/flowfile-queues/{#CONNID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var b = JSON.parse(value);

            var q = b.flowFileQueueListing || b;

            var oid = (q.oldestFlowFileTimestamp != null) ? parseInt(q.oldestFlowFileTimestamp,
            10) : 0;

            var ms = (q.oldestFlowFileEventTimestamp != null) ? parseInt(q.oldestFlowFileEventTimestamp,
            10) : 0;

            var t = oid || ms;

            if (t <= 0) { return 0; }

            return Math.max(0, Math.floor(Date.now() / 1000) - t);

            '
      lld_macro_paths:
      - lld_macro: '{#PGID}'
        path: $.pgid
      - lld_macro: '{#PGNAME}'
        path: $.pgname
      - lld_macro: '{#CONNID}'
        path: $.connid
      - lld_macro: '{#CONNNAME}'
        path: $.connname
      - lld_macro: '{#SRC}'
        path: $.src
      - lld_macro: '{#DEST}'
        path: $.dest
      trigger_prototypes:
      - uuid: b7f0b2c3d4e6f6f708192a3b4c5d6e7f0
        expression: min(/Apache NiFi API by JS Queues/nifi.queue.bp_objects_pct[{#CONNID}],10m)>{$NIFI.QUEUE_BACKPRESSURE_PCT}
        name: 'Fila {#CONNNAME}: back pressure objetos > {$NIFI.QUEUE_BACKPRESSURE_PCT}%'
        priority: AVERAGE
        description: Fila {#CONNNAME} (PG {#PGNAME}) proxima do back pressure por
          objetos.
        manual_close: 'YES'
        tags:
        - tag: queue
          value: '{#CONNNAME}'
        - tag: scope
          value: performance
      - uuid: c0ffee000005d4e6f6f708192a3b4c5d
        expression: min(/Apache NiFi API by JS Queues/nifi.queue.bp_bytes_pct[{#CONNID}],10m)>{$NIFI.QUEUE_BACKPRESSURE_PCT}
        name: 'Fila {#CONNNAME}: back pressure bytes > {$NIFI.QUEUE_BACKPRESSURE_PCT}%'
        priority: AVERAGE
        description: Fila {#CONNNAME} (PG {#PGNAME}) proxima do back pressure por
          bytes.
        manual_close: 'YES'
        tags:
        - tag: queue
          value: '{#CONNNAME}'
        - tag: scope
          value: performance
      - uuid: bb0f1b2c3d4e6f6f708192a3b4c5d6e7f0
        expression: min(/Apache NiFi API by JS Queues/nifi.queue.oldest[{#CONNID}],10m)>{$NIFI.QUEUE_AGE_MIN}
        name: 'Fila {#CONNNAME}: dados parados'
        priority: AVERAGE
        description: O dado mais antigo da fila {#CONNNAME} tem mais de {$NIFI.QUEUE_AGE_MIN}
          segundos.
        manual_close: 'YES'
        tags:
        - tag: queue
          value: '{#CONNNAME}'
        - tag: scope
          value: performance
    vendor:
      name: Internal
      version: '1.0'
  - uuid: c1f0b2c3d4e6f6f708192a3b4c5d6e7f0
    template: Apache NiFi API by JS Counters
    name: Apache NiFi API by JS Counters
    description: 'Descoberta e coleta de counters do NiFi via /counters.

      Permite acompanhar metricas customizadas criadas nos fluxos (UpdateCounter).

      '
    groups:
    - name: Templates
    discovery_rules:
    - uuid: c2f0b2c3d4e6f6f708192a3b4c5d6e7f0
      key: nifi.discovery.counters
      name: Descoberta de counters
      type: HTTP_AGENT
      request_method: GET
      url: '{$NIFI.URL}/counters'
      timeout: '{$NIFI.TIMEOUT}s'
      delay: 5m
      lifetime: 30d
      description: Descobre counters registrados (filtra por {$NIFI.COUNTERS_FILTER}
        regex).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nvar cs = (body.counters && body.counters.counters)\
          \ ? body.counters.counters : [];\nvar rx = '{$NIFI.COUNTERS_FILTER}';\n\
          var rows = [];\ncs.forEach(function (c) {\n  var id = (c.counter && c.counter.id)\
          \ ? c.counter.id : c.id;\n  var nm = (c.counter && c.counter.name) ? c.counter.name\
          \ : (c.name || id);\n  if (rx && rx.trim() !== '') {\n    var re = new RegExp(rx,\
          \ 'i');\n    if (!re.test(nm)) { return; }\n  }\n  rows.push({ '{#COUNTERID}':\
          \ String(id), '{#COUNTERNAME}': String(nm) });\n});\nreturn JSON.stringify({\
          \ 'data': rows });\n"
      item_prototypes:
      - uuid: c3f0b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.counter.value[{#COUNTERNAME}]
        name: 'Counter {#COUNTERNAME}: Valor'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        request_method: GET
        url: '{$NIFI.URL}/counters/{#COUNTERID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var b = JSON.parse(value);

            var c = (b.counter && b.counter.value != null) ? b.counter : ((b.counter)
            ? b.counter : null);

            if (!c && b.counters && b.counters.counters && b.counters.counters[0])
            { c = b.counters.counters[0].counter; }

            var v = c && (c.value != null) ? c.value : (c && c.count != null ? c.count
            : 0);

            return parseInt(v, 10) || 0;

            '
      lld_macro_paths:
      - lld_macro: '{#COUNTERID}'
        path: $.counterid
      - lld_macro: '{#COUNTERNAME}'
        path: $.countername
    vendor:
      name: Internal
      version: '1.0'
  template_groups:
  - name: Templates
    uuid: b9f0b2c3d4e6f6f708192a3b4c5d6e7f0
