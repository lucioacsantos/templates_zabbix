zabbix_export:
  version: '7.4'
  templates:
  - uuid: a1f1b2c3d4e6f6f708192a3b4c5d6e7f0
    template: Apache NiFi API by JS
    name: Apache NiFi API by JS
    description: 'Template master para monitoramento do Apache NiFi via API REST (/flow,
      /controller, /counters).

      Coleta e processamento com JavaScript embutido (item HTTP + preprocessing JS),
      sem agente.


      A LLD descobre Process Groups (via /flow/process-groups/root e processadores
      por grupo)

      ou usa a lista estatica {$NIFI.PROCESS_GROUPS}. Templates dependentes coletam:

      recursos do cluster/jvm, filas (queues) e counters/estatisticas.


      Requer Zabbix Server/Proxy >= 6.0, conectividade HTTP(S) ate a API do NiFi e
      credencial

      com permissoes de leitura (>= "read" no /flow). Autenticacao por Basic (padrao)
      ou

      Bearer token ({$NIFI.AUTH}).

      '
    groups:
    - name: Templates
    macros:
    - macro: '{$NIFI.URL}'
      value: https://nifi.exemplo.com:8443/nifi-api
      description: 'URL base da API REST do NiFi (sem barra final). Ex.: https://host:8443/nifi-api'
    - macro: '{$NIFI.USER}'
      value: ''
      description: Usuario para autenticacao Basic. Vazio = sem autenticacao.
    - macro: '{$NIFI.PASSWORD}'
      type: SECRET_TEXT
      description: Senha para autenticacao Basic.
    - macro: '{$NIFI.TOKEN}'
      type: SECRET_TEXT
      description: Bearer token (usado se {$NIFI.AUTH}=bearer).
    - macro: '{$NIFI.AUTH}'
      value: basic
      description: 'Modo de autenticacao: basic ou bearer.'
    - macro: '{$NIFI.ROOT_PG_ID}'
      value: root
      description: ID do Process Group raiz (ou "root").
    - macro: '{$NIFI.PROCESS_GROUPS}'
      value: ''
      description: Lista estatica de IDs de Process Groups separados por virgula.
        Vazio = descobrir via API.
    - macro: '{$NIFI.TIMEOUT}'
      value: '15'
      description: Timeout (s) das requisicoes HTTP.
    - macro: '{$NIFI.RETRIES}'
      value: '2'
      description: Tentativas extras em caso de falha.
    - macro: '{$NIFI.QUEUE_BACKPRESSURE_PCT}'
      value: '80'
      description: '% do back pressure (object/bytes threshold) para trigger de fila
        saturada.'
    - macro: '{$NIFI.QUEUE_AGE_MIN}'
      value: '300'
      description: Idade maxima (s) do dado mais antigo na fila antes do trigger.
    - macro: '{$NIFI.BULLETS_WARN}'
      value: '0'
      description: Quantidade de bullets em WARNING para trigger.
    - macro: '{$NIFI.BULLETS_ERROR}'
      value: '1'
      description: Quantidade de bullets em ERROR para trigger.
    - macro: '{$NIFI.PROC_STOPPED}'
      value: '0'
      description: Processadores stopped/invalid/disabled tolerados antes do trigger
        (>=).
    - macro: '{$NIFI.GC_PCT}'
      value: '80'
      description: '% de tempo em GC da JVM para trigger.'
    - macro: '{$NIFI.HEAP_PCT}'
      value: '85'
      description: '% de heap da JVM para trigger.'
    - macro: '{$NIFI.COUNTERS_FILTER}'
      value: ''
      description: Regex (case-insensitive) para filtrar counters descobertos. Vazio
        = todos.
    - macro: '{$NIFI.STATUS_NS_TRIGGER}'
      value: '3'
      description: Ciclos com API down antes do trigger.
    - macro: '{$NIFI.THREADS_MAX}'
      value: '0'
      description: Total de threads ativas para trigger (0 = desativado).
    - macro: '{$NIFI.VERIFY_HOST}'
      value: '1'
      description: Validar host/SSL do endpoint (1=sim, 0=nao).
    items:
    - uuid: a2f1b2c3d4e6f6f708192a3b4c5d6e7f0
      key: nifi.api.status
      name: 'NiFi API: Status do servico'
      type: HTTP_AGENT
      value_type: CHAR
      history: 7d
      trends: '0'
      request_method: GET
      url: '{$NIFI.URL}/flow/status'
      headers:
      - name: Content-Type
        value: application/json
      timeout: '{$NIFI.TIMEOUT}s'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nif (!body.controller) { throw 'NiFi API:\
          \ resposta inesperada'; }\nvar c = body.controller;\nreturn JSON.stringify({\n\
          \  'status': 'ok',\n  'active_threads': c.activeThreadCount != null ? c.activeThreadCount\
          \ : 0,\n  'queued': c.queuedCount != null ? c.queuedCount : 0,\n  'queued_bytes':\
          \ c.queuedContentSize != null ? c.queuedContentSize : 0,\n  'running': c.runDuration\
          \ ? 1 : 0\n});\n"
      triggers:
      - uuid: a3f1b2c3d4e6f6f708192a3b4c5d6e7f0
        expression: nodata(/Apache NiFi API by JS/nifi.api.status,{$NIFI.STATUS_NS_TRIGGER}m)=1
        name: 'NiFi API: sem dados (servico indisponivel)'
        priority: HIGH
        description: A API do NiFi nao respondeu nos ultimos {$NIFI.STATUS_NS_TRIGGER}
          minutos.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
    - uuid: a4f1b2c3d4e6f6f708192a3b4c5d6e7f0
      key: nifi.api.bullets
      name: 'NiFi API: Bullets do UI (warnings/errors)'
      type: HTTP_AGENT
      value_type: TEXT
      history: 7d
      trends: '0'
      request_method: GET
      url: '{$NIFI.URL}/controller/bulletin-board'
      timeout: '{$NIFI.TIMEOUT}s'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nvar bullets = (body.bulletin && body.bulletin.bulletins)\
          \ ? body.bulletin.bulletins : [];\nvar warn = 0;\nvar err = 0;\nvar last\
          \ = '';\nvar sev = ['WARN', 'ERROR'];\nbullets.forEach(function (b) {\n\
          \  if (b.groupWeight && b.groupWeight > 0) {\n    var level = (b.bulletin\
          \ && b.bulletin.level) ? b.bulletin.level.toUpperCase() : '';\n    if (level\
          \ === 'WARN') { warn++; }\n    if (level === 'ERROR') { err++; }\n    if\
          \ (!last && level === 'ERROR') { last = (b.bulletin.message || '').substring(0,\
          \ 200); }\n  }\n});\nreturn JSON.stringify({ 'warn': warn, 'error': err,\
          \ 'last_error': last });\n"
        error_handler: DISCARD_VALUE
      triggers:
      - uuid: a5f1b2c3d4e6f6f708192a3b4c5d6e7f0
        expression: find(/Apache NiFi API by JS/nifi.api.bullets,5m,"like","\"error\":{$NIFI.BULLETS_ERROR}")=1
        name: 'NiFi: bullets de ERROR no bulletin board'
        priority: AVERAGE
        description: Existem {$NIFI.BULLETS_ERROR} ou mais boletins de ERROR no NiFi
          (verificar item nifi.api.bullets).
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    discovery_rules:
    - uuid: b1f1b2c3d4e6f6f708192a3b4c5d6e7f0
      key: nifi.discovery.process_groups
      name: Descoberta de Process Groups
      type: HTTP_AGENT
      request_method: GET
      url: '{$NIFI.URL}/flow/process-groups/{$NIFI.ROOT_PG_ID}'
      timeout: '{$NIFI.TIMEOUT}s'
      delay: 1h
      lifetime: 30d
      description: Descobre Process Groups filhos do grupo raiz (ou usa {$NIFI.PROCESS_GROUPS}).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var STATIC = '{$NIFI.PROCESS_GROUPS}';\nvar rows = [];\nvar seen = {};\n\
          function push(id, name, path) {\n  if (!id || seen[id]) { return; }\n  seen[id]\
          \ = 1;\n  rows.push({ '{#PGID}': id, '{#PGNAME}': name || id, '{#PGPATH}':\
          \ path || '/' });\n}\nif (STATIC && STATIC.trim() !== '') {\n  STATIC.split(',').forEach(function\
          \ (s) { push(s.trim(), s.trim(), '/'); });\n} else {\n  var body = JSON.parse(value);\n\
          \  var root = body && body.processGroups ? body.processGroups : [];\n  root.forEach(function\
          \ (g) {\n    var comp = g.component ? g.component : g;\n    var path = (g.component\
          \ && g.component.versionedFlowCoordinates) ? g.component.versionedFlowCoordinates.container\
          \ : '/';\n    push(comp.id, comp.name, path);\n  });\n}\nreturn JSON.stringify({\
          \ 'data': rows });\n"
      item_prototypes:
      - uuid: b2f1b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.pg.status[{#PGID}]
        name: 'PG {#PGNAME}: Status (raw)'
        type: HTTP_AGENT
        value_type: TEXT
        history: 1d
        trends: '0'
        request_method: GET
        url: '{$NIFI.URL}/flow/status/process-groups/{#PGID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            if (!body.processGroupStatus) { throw ''NiFi API: sem processGroupStatus'';
            }

            return JSON.stringify(body.processGroupStatus);

            '
      - uuid: b3f1b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.pg.threads[{#PGID}]
        name: 'PG {#PGNAME}: Threads ativas'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        units: threads
        request_method: GET
        url: '{$NIFI.URL}/flow/status/process-groups/{#PGID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus;

            return s && s.activeThreadCount != null ? parseInt(s.activeThreadCount,
            10) : 0;

            '
      - uuid: b3f1b2c3d4e6f6f708192a3b4c5d6e800
        key: nifi.pg.queued_count[{#PGID}]
        name: 'PG {#PGNAME}: Filas - objetos em fila'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        request_method: GET
        url: '{$NIFI.URL}/flow/status/process-groups/{#PGID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus;

            var agg = s && s.queuedCount != null ? parseInt(s.queuedCount, 10) : 0;

            return agg;

            '
      - uuid: b4f1b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.pg.queued_bytes[{#PGID}]
        name: 'PG {#PGNAME}: Filas - bytes em fila'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        units: B
        request_method: GET
        url: '{$NIFI.URL}/flow/status/process-groups/{#PGID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus;

            return s && s.queuedContentSize != null ? parseInt(s.queuedContentSize,
            10) : 0;

            '
      - uuid: b5f1b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.pg.flowfiles_in[{#PGID}]
        name: 'PG {#PGNAME}: FlowFiles in (5m)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        units: '!/s'
        request_method: GET
        url: '{$NIFI.URL}/flow/status/process-groups/{#PGID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus;

            var r = s && s.flowFilesIn != null ? parseInt(s.flowFilesIn, 10) : 0;

            return r / 300;

            '
      - uuid: b6f1b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.pg.flowfiles_out[{#PGID}]
        name: 'PG {#PGNAME}: FlowFiles out (5m)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        units: '!/s'
        request_method: GET
        url: '{$NIFI.URL}/flow/status/process-groups/{#PGID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus;

            var r = s && s.flowFilesOut != null ? parseInt(s.flowFilesOut, 10) : 0;

            return r / 300;

            '
      - uuid: b7f1b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.pg.bytes_read[{#PGID}]
        name: 'PG {#PGNAME}: Bytes lidos (5m)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        units: Bps
        request_method: GET
        url: '{$NIFI.URL}/flow/status/process-groups/{#PGID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus;

            var r = s && s.bytesRead != null ? parseInt(s.bytesRead, 10) : 0;

            return r / 300;

            '
      - uuid: b8f1b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.pg.bytes_written[{#PGID}]
        name: 'PG {#PGNAME}: Bytes escritos (5m)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        units: Bps
        request_method: GET
        url: '{$NIFI.URL}/flow/status/process-groups/{#PGID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            var s = body.processGroupStatus;

            var r = s && s.bytesWritten != null ? parseInt(s.bytesWritten, 10) : 0;

            return r / 300;

            '
      - uuid: b9f1b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.pg.proc_errors[{#PGID}]
        name: 'PG {#PGNAME}: Processadores com erro/stopped'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        request_method: GET
        url: '{$NIFI.URL}/flow/process-groups/{#PGID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - "var body = JSON.parse(value);\nvar procs = (body.processGroupFlow &&\
            \ body.processGroupFlow.flow && body.processGroupFlow.flow.processors)\n\
            \  ? body.processGroupFlow.flow.processors : [];\nvar bad = 0;\nvar BAD\
            \ = ['INVALID', 'DISABLED', 'STOPPED'];\nprocs.forEach(function (p) {\n\
            \  var st = (p.component && p.component.state) ? p.component.state.toUpperCase()\
            \ : '';\n  var needs = p.component && (p.component.validationErrors ||\
            \ []).length > 0;\n  if (st === 'INVALID' || needs) { bad++; }\n});\n\
            return bad;\n"
      - uuid: bb1f1b2c3d4e6f6f708192a3b4c5d6e7f0
        key: nifi.pg.uptime[{#PGID}]
        name: 'PG {#PGNAME}: Uptime dos processadores (s)'
        type: HTTP_AGENT
        value_type: UNSIGNED
        history: 7d
        trends: 30d
        units: s
        request_method: GET
        url: '{$NIFI.URL}/flow/process-groups/{#PGID}'
        timeout: '{$NIFI.TIMEOUT}s'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - "var body = JSON.parse(value);\nvar procs = (body.processGroupFlow &&\
            \ body.processGroupFlow.flow && body.processGroupFlow.flow.processors)\n\
            \  ? body.processGroupFlow.flow.processors : [];\nvar max = 0;\nvar now\
            \ = Date.now();\nprocs.forEach(function (p) {\n  if (p.component && p.component.state\
            \ === 'RUNNING' && p.status && p.status.statsSnapshot) {\n    var st =\
            \ p.status.statsSnapshot;\n    var up = st.uptime ? parseInt(st.uptime,\
            \ 10) : 0;\n    if (up > max) { max = up; }\n  }\n});\nreturn max;\n"
      trigger_prototypes:
      - uuid: bc1f1b2c3d4e6f6f708192a3b4c5d6e7f0
        expression: nodata(/Apache NiFi API by JS/nifi.pg.status[{#PGID}],{$NIFI.STATUS_NS_TRIGGER}m)=1
        name: 'PG {#PGNAME}: sem dados da API'
        priority: WARNING
        description: Process Group {#PGNAME} ({#PGID}) nao respondeu via API.
        manual_close: 'YES'
        tags:
        - tag: processgroup
          value: '{#PGNAME}'
        - tag: scope
          value: availability
      - uuid: ba1f1b2c3d4e6f6f708192a3b4c5d6e7f0
        expression: min(/Apache NiFi API by JS/nifi.pg.proc_errors[{#PGID}],10m)>{$NIFI.PROC_STOPPED}
        name: 'PG {#PGNAME}: processadores invalidos/parados'
        priority: AVERAGE
        description: Existem processadores invalidos ou com erros de validacao no
          PG {#PGNAME}.
        manual_close: 'YES'
        tags:
        - tag: processgroup
          value: '{#PGNAME}'
        - tag: scope
          value: availability
      lld_macro_paths:
      - lld_macro: '{#PGID}'
        path: $.pgid
      - lld_macro: '{#PGNAME}'
        path: $.pgname
      - lld_macro: '{#PGPATH}'
        path: $.pgpath
    tags:
    - tag: class
      value: software
    - tag: target
      value: nifi
    - tag: target
      value: dataflow
    valuemaps:
    - uuid: d1f0b2c3d4e6f6f708192a3b4c5d6e7f0
      name: NiFi API status
      mappings:
      - value: ok
        newvalue: Servico OK
      - value: down
        newvalue: Servico DOWN
    vendor:
      name: Internal
      version: '1.0'
  - uuid: a1f0b2c3d4e6f6f708192a3b4c5d6e7f0
    template: Apache NiFi API by JS Cluster Resources
    name: Apache NiFi API by JS Cluster Resources
    description: 'Coleta de recursos do cluster NiFi:

      - JVM: heap usado/max, % de heap, GC time %, threads, uptime

      - Storage: espaco livre/usado por repository (flowfile/content/provenance)

      - Cluster: nodes, eleicao de lider, total de threads

      '
    groups:
    - name: Templates
    items:
    - uuid: a5f0b2c3d4e6f6f708192a3b4c5d6e7f0
      key: nifi.jvm.raw
      name: 'NiFi JVM: Status (raw)'
      type: HTTP_AGENT
      value_type: TEXT
      history: 1d
      trends: '0'
      request_method: GET
      url: '{$NIFI.URL}/flow/status'
      timeout: '{$NIFI.TIMEOUT}s'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var body = JSON.parse(value);

          if (!body.controller) { throw ''NiFi API: sem controller''; }

          return JSON.stringify(body.controller);

          '
    - uuid: a6f0b2c3d4e6f6f708192a3b4c5d6e7f0
      key: nifi.jvm.heap_used
      name: 'NiFi JVM: Heap usado'
      type: DEPENDENT
      value_type: UNSIGNED
      history: 7d
      trends: 30d
      units: B
      master_item:
        key: nifi.jvm.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var b = JSON.parse(value);

          var h = (b.jvmStats && b.jvmStats.heapUsed) ? b.jvmStats.heapUsed : ''0'';

          return parseInt(h, 10);

          '
    - uuid: a7f0b2c3d4e6f6f708192a3b4c5d6e7f0
      key: nifi.jvm.heap_max
      name: 'NiFi JVM: Heap maximo'
      type: DEPENDENT
      value_type: UNSIGNED
      history: 7d
      trends: 30d
      units: B
      master_item:
        key: nifi.jvm.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var b = JSON.parse(value);

          var h = (b.jvmStats && b.jvmStats.heapMaximum) ? b.jvmStats.heapMaximum
          : ''0'';

          return parseInt(h, 10);

          '
    - uuid: a8f0b2c3d4e6f6f708192a3b4c5d6e7f0
      key: nifi.jvm.heap_pct
      name: 'NiFi JVM: Heap %'
      type: DEPENDENT
      value_type: FLOAT
      history: 7d
      trends: 30d
      units: '%'
      master_item:
        key: nifi.jvm.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var b = JSON.parse(value);

          var used = parseInt(b.jvmStats ? (b.jvmStats.heapUsed || ''0'') : ''0'',
          10);

          var max = parseInt(b.jvmStats ? (b.jvmStats.heapMaximum || ''0'') : ''0'',
          10);

          if (max <= 0) { return 0; }

          return 100 * used / max;

          '
        error_handler: DISCARD_VALUE
      triggers:
      - uuid: a9f0b2c3d4e6f6f708192a3b4c5d6e7f0
        expression: min(/Apache NiFi API by JS Cluster Resources/nifi.jvm.heap_pct,5m)>{$NIFI.HEAP_PCT}
        name: 'NiFi JVM: heap > {$NIFI.HEAP_PCT}%'
        priority: WARNING
        description: Uso de heap da JVM do NiFi acima de {$NIFI.HEAP_PCT}%.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: performance
    - uuid: a9f0b2c3d4e6f6f708192a3b4c5d6e800
      key: nifi.jvm.uptime
      name: 'NiFi JVM: Uptime'
      type: DEPENDENT
      value_type: UNSIGNED
      history: 7d
      trends: 30d
      units: s
      master_item:
        key: nifi.jvm.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var b = JSON.parse(value);

          var st = (b.controller && b.controller.stats && b.controller.stats.uptime)
          ? b.controller.stats.uptime : ''0'';

          return parseInt(st, 10);

          '
    - uuid: aa0f1b2c3d4e6f6f708192a3b4c5d6e7f0
      key: nifi.jvm.gc_pct
      name: 'NiFi JVM: Tempo em GC (%)'
      type: DEPENDENT
      value_type: FLOAT
      history: 7d
      trends: 30d
      units: '%'
      master_item:
        key: nifi.jvm.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var b = JSON.parse(value);

          var st = b.jvmStats || {};

          var gc = (st.gcTime != null && st.uptime != null) ? (100 * parseInt(st.gcTime,
          10) / parseInt(st.uptime, 10)) : 0;

          return gc;

          '
        error_handler: DISCARD_VALUE
    - uuid: ab0f1b2c3d4e6f6f708192a3b4c5d6e7f0
      key: nifi.cluster.nodes
      name: 'NiFi Cluster: Nodes'
      type: DEPENDENT
      value_type: UNSIGNED
      history: 7d
      trends: 30d
      master_item:
        key: nifi.jvm.raw
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var b = JSON.parse(value);

          var nodes = (b.cluster && b.cluster.nodes) ? b.cluster.nodes : [];

          return nodes.length;

          '
    - uuid: ac0f1b2c3d4e6f6f708192a3b4c5d6e7f0
      key: nifi.cluster.nodes_connected
      name: 'NiFi Cluster: Nodes conectados'
