        parameters:
        - "var b = JSON.parse(value);\nvar nodes = (b.cluster && b.cluster.nodes)\
          \ ? b.cluster.nodes : [];\nvar ok = 0;\nnodes.forEach(function (n) {\n \
          \ var s = (n.nodeId && n.status) ? n.status : '';\n  var roles = (n.roles\
          \ || []).join(',');\n  if (String(s).toLowerCase() !== 'disconnected' &&\
          \ String(s).toLowerCase() !== 'offline') { ok++; }\n});\nreturn ok;\n"
