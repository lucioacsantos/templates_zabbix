            '
  - uuid: 2f1b2c3d4e6f6f708192a3b4c5d6e7f0
    template: OpenShift Thanos API by JS Pods
    name: OpenShift Thanos API by JS Pods
    description: 'Coleta por namespace (descoberto pelo template master):

      - Pods por fase (Running, Pending, Failed, Unknown)

      - Pods nao-Running

      - Restart de containers (por hora)

      '
    groups:
    - name: Templates
      uuid: c0ffee000003d4e6f6f708192a3b4c5d
    discovery_rules:
    - uuid: 3a1b2c3d4e6f6f708192a3b40016e7f0
      key: thanos.discovery.namespace_nsname_pods
      name: 'Namespace {#NSNAME}: Pods'
      type: HTTP_AGENT
      request_method: GET
      url: '{$THANOS.URL}/api/v1/query?query=kube_pod_info'
      headers:
      - name: Authorization
        value: Bearer {$THANOS.TOKEN}
      timeout: '{$THANOS.TIMEOUT}s'
      delay: 5m
      lifetime: 30d
      description: Item de suporte para manter a LLD (dependente do master).
      lld_macros:
