zabbix_export:
  version: '7.4'
  templates:
  - uuid: ebcc94cdbd12404ea91e28711fe6259a
    template: OpenShift Thanos API by JS
    name: OpenShift Thanos API by JS
    description: 'Template master para monitoramento de namespaces OpenShift via API
      Thanos/Prometheus.

      Este template atua como master e descobre namespaces, vinculando automaticamente
      os templates dependentes de Recursos, Pods, Rede, Application, Storage e Events.'
    groups:
    - name: Templates
    macros:
    - macro: '{$THANOS.URL}'
      value: https://thanos-querier-openshift-monitoring.apps.cluster.example
      description: URL base do Thanos Query/Querier (sem barra final).
    - macro: '{$THANOS.TOKEN}'
      type: SECRET_TEXT
      description: Bearer token de service account com permissao de leitura das metricas.
    - macro: '{$THANOS.NAMESPACES}'
      value: ''
      description: 'Filtro de namespaces: lista separada por virgula ou pipe (ex.:
        ns1,ns2 ou ns1|ns2). Vazio = descobrir todos os namespaces ativos (kube_namespace_status_phase).'
    - macro: '{$THANOS.STEP}'
      value: 60s
      description: Step das queries PromQL (range/vector).
    - macro: '{$THANOS.TIMEOUT}'
      value: 15s
      description: 'Timeout das requisicoes HTTP (com unidade, ex.: 15s ou {$THANOS.TIMEOUT}s).'
    - macro: '{$THANOS.RETRIES}'
      value: '2'
      description: Tentativas extras em caso de falha.
    - macro: '{$THANOS.HTTP_PROXY}'
      value: ''
      description: 'Proxy HTTP opcional (ex.: http://proxy:8080).'
    - macro: '{$THANOS.PROXY_DNS}'
      value: '0'
      description: Usar proxy para hostnames (1=sim, 0=nao).
    - macro: '{$THANOS.VERIFY_HOST}'
      value: '1'
      description: Validar host/SSL do endpoint (1=sim, 0=nao).
    - macro: '{$THANOS.STATUS_NS_TRIGGER}'
      value: 3m
      description: 'Ciclos/periodo com API down antes do trigger (com unidade, ex.:
        3m).'
    - macro: '{$THANOS.CPU_LIMIT_PCT}'
      value: '90'
      description: Percentual do limite de CPU por namespace para trigger.
    - macro: '{$THANOS.MEM_LIMIT_PCT}'
      value: '90'
      description: Percentual do limite de memoria por namespace para trigger.
    - macro: '{$THANOS.EPS_P95}'
      value: '500'
      description: Requisicoes/s p95 por namespace (informativo).
    - macro: '{$THANOS.EPS_MAX}'
      value: '1000'
      description: Requisicoes/s maximo por namespace para trigger.
    - macro: '{$THANOS.HPA_MIN_PCT}'
      value: '90'
      description: Percentual do minimo de replicas HPA para trigger.
    - macro: '{$THANOS.HPA_MAX_PCT}'
      value: '90'
      description: Percentual do maximo de replicas HPA para trigger.
    - macro: '{$THANOS.NS_CPU_LIMIT}'
      value: '0'
      description: 'Filtro LLD: ResourceQuota de CPU >= valor (cores). 0 = todos.'
    - macro: '{$THANOS.NS_MEM_LIMIT_GT}'
      value: '0'
      description: 'Filtro LLD: ResourceQuota de memoria >= valor (bytes). 0 = todos.'
    items:
    - uuid: c2a5a4970749420e87614674c196bf3e
      key: thanos.thanos_api_status_do_servico
      name: 'Thanos API: Status do servico'
      type: HTTP_AGENT
      value_type: CHAR
      history: 7d
      trends: '0'
      request_method: GET
      url: '{$THANOS.URL}/api/v1/query?query=up'
      headers:
      - name: Authorization
        value: Bearer {$THANOS.TOKEN}
      timeout: '{$THANOS.TIMEOUT}'
      tags:
      - tag: component
        value: health
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nif (body.status !== 'success') { throw 'Thanos\
          \ API status: ' + body.status; }\nvar ns = {};\nvar total = 0;\nvar up =\
          \ 0;\nbody.data.result.forEach(function (r) {\n  total++;\n  if (parseFloat(r.value[1])\
          \ > 0) { up++; }\n  var n = r.metric.namespace;\n  if (n) { ns[n] = 1; }\n\
          });\nvar off = total - up;\nreturn JSON.stringify({ 'status': 'success',\
          \ 'targets_total': total, 'targets_up': up, 'targets_off': off, 'namespaces':\
          \ Object.keys(ns).sort() });\n"
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value); if (body.status !== 'success') { return 'FALHA'; } return 'OK';"
      triggers:
      - uuid: 61a958cfb43744809a8f0e4b6cb1a290
        expression: find(/OpenShift Thanos API by JS/thanos.thanos_api_status_do_servico,1m,"regexp","^FALHA$")=1
          or nodata(/OpenShift Thanos API by JS/thanos.thanos_api_status_do_servico,5m)=1
        name: 'Thanos API: servico indisponivel'
        opdata: 'Thanos API: {ITEM.LASTVALUE1}'
        priority: HIGH
        description: |
          A coleta do status do Thanos Querier falhou (item sem dado ou resposta invalida) por 5 minutos, ou o valor de status e FALHA.
          SIGNIFICADO: indisponibilidade da FONTE de monitoramento (API do Thanos).
          ACAO: validar rota/DNS/firewall e token (curl no README); se o querier cair, TODOS os itens do template ficam sem dados — incidentes de namespace podem estar mascarados.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
    discovery_rules:
    - uuid: ff4ff8cc91ae49afa8014dcfd741eb36
      key: thanos.discovery.descoberta_de_namespaces
      name: Descoberta de namespaces
      type: HTTP_AGENT
      request_method: GET
      url: '{$THANOS.URL}/api/v1/query?query=kube_namespace_status_phase%7Bphase%3D%22Active%22%7D'
      headers:
      - name: Authorization
        value: Bearer {$THANOS.TOKEN}
      timeout: '{$THANOS.TIMEOUT}'
      delay: 1h
      lifetime: 30d
      description: Descobre namespaces ativos via kube_namespace_status_phase; filtra
        por {$THANOS.NAMESPACES} (regex OU por virgula, vazio = todos).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nif (body.status !== 'success') { throw 'Thanos\
          \ API LLD: ' + body.status; }\nvar STATIC = '{$THANOS.NAMESPACES}';\nvar\
          \ filter = null;\nif (typeof STATIC === 'string' && STATIC.trim() !== '')\
          \ {\n  try { filter = new RegExp('^(?:' + STATIC.trim().split(/\\s*,\\s*/).join('|')\
          \ + ')$'); }\n  catch (e) { throw 'Regex invalida em {$THANOS.NAMESPACES}:\
          \ ' + e.message; }\n}\nvar nsSet = {};\nbody.data.result.forEach(function\
          \ (r) {\n  var n = r.metric && r.metric.namespace;\n  if (!n) { return;\
          \ }\n  if (filter && !filter.test(n)) { return; }\n  nsSet[n] = 1;\n});\n\
          var rows = Object.keys(nsSet).sort().map(function (n) {\n  return { '{#NSNAME}':\
          \ n };\n});\nif (!rows.length) { throw 'LLD sem resultados: nenhum namespace\
          \ casou com o filtro {$THANOS.NAMESPACES}.'; }\nreturn JSON.stringify({\
          \ 'data': rows });\n"
      item_prototypes:
      - uuid: 4674baad2e2c4d5ba45c3c933a7fe6aa
        key: thanos.namespace_nsname_status_up_targets[{#NSNAME}]
        name: 'Namespace {#NSNAME}: Status (up targets)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        request_method: GET
        url: '{$THANOS.URL}/api/v1/query?query=up%7Bnamespace%3D~%22{#NSNAME}%22%7D'
        headers:
        - name: Authorization
          value: Bearer {$THANOS.TOKEN}
        timeout: '{$THANOS.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value); if (body.status !== ''success'') { throw
            ''Thanos API: '' + body.status; } if (!(body.data.result && body.data.result.length))
            { return -1; } var up = 0; body.data.result.forEach(function (r) { if
            (parseFloat(r.value[1]) > 0) { up++; } }); return up === 0 ? 0 : up;'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 15m
      - uuid: 97ef03b2d93849568d7681a4ec02bbe3
        key: thanos.namespace_nsname_cpu_usada_millicores[{#NSNAME}]
        name: 'Namespace {#NSNAME}: CPU usada (millicores)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        units: m
        request_method: GET
        url: '{$THANOS.URL}/api/v1/query?query=sum(rate(container_cpu_usage_seconds_total%7Bnamespace%3D~%22{#NSNAME}%22%2Ccontainer%21%3D%22%22%2Cimage%21%3D%22%22%7D%5B{$THANOS.STEP}%5D))'
        headers:
        - name: Authorization
          value: Bearer {$THANOS.TOKEN}
        timeout: '{$THANOS.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value); if (body.status !== ''success'') { throw
            ''Thanos API: '' + body.status; } return (body.data.result && body.data.result.length)
            ? (parseFloat(body.data.result[0].value[1]) * 1000) : 0;'
