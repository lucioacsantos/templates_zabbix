zabbix_export:
  version: '7.4'
  templates:
  - uuid: ebcc94cdbd12404ea91e28711fe6259a
    template: OpenShift Thanos API by JS
    name: OpenShift Thanos API by JS
    description: 'Template master para monitoramento de namespaces OpenShift via API
      Thanos/Prometheus

      (Thanos Querier). Coleta e processamento feitos com JavaScript embutido (item
      HTTP + JS),

      sem necessidade de Zabbix agent.


      A LLD descobre namespaces via query `up` (job kubernetes-pods) ou usa uma lista
      estatica

      definida em {$THANOS.NAMESPACES}. Os templates dependentes agregam recursos,
      pods,

      rede, quota e HPA por namespace.


      Requer Zabbix Server/Proxy >= 6.0 e conectividade HTTP(S) do Zabbix ate o Thanos
      Querier.

      '
    groups:
    - name: Templates
    macros:
    - macro: '{$THANOS.URL}'
      value: https://thanos-querier-openshift-monitoring.apps.cluster.example
      description: URL base do Thanos Query/Querier (sem barra final).
    - macro: '{$THANOS.TOKEN}'
      type: SECRET_TEXT
      description: Bearer token de service account com permissao de leitura das metricas.
    - macro: '{$THANOS.NAMESPACES}'
      value: ''
      description: Lista estatica de namespaces separados por virgula (regex). Vazio
        = descobrir via query `up`.
    - macro: '{$THANOS.STEP}'
      value: 60s
      description: Step das queries PromQL (range/vector).
    - macro: '{$THANOS.TIMEOUT}'
      value: 15s
      description: 'Timeout das requisicoes HTTP (com unidade, ex.: 15s ou {$X}s).'
    - macro: '{$THANOS.RETRIES}'
      value: '2'
      description: Tentativas extras em caso de falha.
    - macro: '{$THANOS.HTTP_PROXY}'
      value: ''
      description: 'Proxy HTTP opcional (ex.: http://proxy:8080).'
    - macro: '{$THANOS.PROXY_DNS}'
      value: '0'
      description: Usar proxy para hostnames (1=sim, 0=nao).
    - macro: '{$THANOS.VERIFY_HOST}'
      value: '1'
      description: Validar host/SSL do endpoint (1=sim, 0=nao).
    - macro: '{$THANOS.STATUS_NS_TRIGGER}'
      value: '3'
      description: Ciclos com namespace down antes do trigger.
    - macro: '{$THANOS.CPU_LIMIT_PCT}'
      value: '90'
      description: Percentual do limite de CPU por namespace para trigger.
    - macro: '{$THANOS.MEM_LIMIT_PCT}'
      value: '90'
      description: Percentual do limite de memoria por namespace para trigger.
    - macro: '{$THANOS.EPS_P95}'
      value: '500'
      description: Requisicoes/s p95 por namespace (informativo).
    - macro: '{$THANOS.EPS_MAX}'
      value: '1000'
      description: Requisicoes/s maximo por namespace para trigger.
    - macro: '{$THANOS.HPA_MIN_PCT}'
      value: '90'
      description: Percentual do minimo de replicas HPA para trigger.
    - macro: '{$THANOS.HPA_MAX_PCT}'
      value: '90'
      description: Percentual do maximo de replicas HPA para trigger.
    - macro: '{$THANOS.NS_CPU_LIMIT}'
      value: '0'
      description: 'Filtro LLD: ResourceQuota de CPU >= valor (cores). 0 = todos.'
    - macro: '{$THANOS.NS_MEM_LIMIT_GT}'
      value: '0'
      description: 'Filtro LLD: ResourceQuota de memoria >= valor (bytes). 0 = todos.'
    items:
    - uuid: 736903d326504b98b11a9fd608d23b6d
      key: thanos.thanos_api_status_do_servico
      name: 'Thanos API: Status do servico'
      type: HTTP_AGENT
      value_type: CHAR
      history: 7d
      trends: '0'
      request_method: GET
      url: '{$THANOS.URL}/api/v1/query?query=up%7Bjob%3D%22kubernetes-pods%22%7D'
      headers:
      - name: Authorization
        value: Bearer {$THANOS.TOKEN}
      timeout: '{$THANOS.TIMEOUT}'
      tags:
      - tag: component
        value: health
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nif (body.status !== 'success') { throw 'Thanos\
          \ API status: ' + body.status; }\nvar ns = {};\nvar total = 0;\nvar up =\
          \ 0;\nbody.data.result.forEach(function (r) {\n  total++;\n  if (parseFloat(r.value[1])\
          \ > 0) { up++; }\n  var n = r.metric.namespace;\n  if (n) { ns[n] = 1; }\n\
          });\nreturn JSON.stringify({ 'status': 'success', 'targets_total': total,\
          \ 'targets_up': up, 'targets_down': total - up, 'namespaces': Object.keys(ns).sort()\
          \ });\n"
      triggers:
      - uuid: 2e4006ad05fe436e9ce4236dfc9aa060
        expression: find(/OpenShift Thanos API by JS/thanos.thanos_api_status_do_servico,1m,"regexp","[Ff][Aa][Ll][Hh][Aa]|[Dd][Oo][Ww][Nn]")=1
        name: 'Thanos API: servico indisponivel'
        opdata: 'Thanos API: {ITEM.LASTVALUE1}'
        priority: HIGH
        description: A coleta do status do Thanos API falhou ou retornou servico down.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: availability
    discovery_rules:
    - uuid: 6df897edd03649ad89da667d784dee1c
      key: thanos.discovery.descoberta_de_namespaces
      name: Descoberta de namespaces
      type: HTTP_AGENT
      request_method: GET
      url: '{$THANOS.URL}/api/v1/query?query=up%7Bjob%3D%22kubernetes-pods%22%7D'
      headers:
      - name: Authorization
        value: Bearer {$THANOS.TOKEN}
      timeout: '{$THANOS.TIMEOUT}'
      delay: 1h
      lifetime: 30d
      description: Descobre namespaces alvo via query `up`; usa {$THANOS.NAMESPACES}
        se definido.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var STATIC = '{$THANOS.NAMESPACES}';\nvar CPU_MIN = parseFloat('{$THANOS.NS_CPU_LIMIT}')\
          \ || 0;\nvar MEM_MIN = parseFloat('{$THANOS.NS_MEM_LIMIT_GT}') || 0;\nvar\
          \ nsSet = {};\nif (STATIC && STATIC.trim() !== '') {\n  STATIC.split(',').forEach(function\
          \ (s) { nsSet[s.trim()] = { cpu: 0, mem: 0 }; });\n}\nvar body = JSON.parse(value);\n\
          if (body.status !== 'success') { throw 'Thanos API LLD: ' + body.status;\
          \ }\nbody.data.result.forEach(function (r) {\n  var n = r.metric.namespace;\n\
          \  if (n && !nsSet[n]) { nsSet[n] = { cpu: 0, mem: 0 }; }\n});\nbody.data.result.forEach(function\
          \ (r) {\n  var q = r.metric.quota || '';\n  var m = /(?:cpu=(\\d+(?:\\.\\\
          d+)?))/.exec(q);\n  if (m) { r._cpu = parseFloat(m[1]); }\n});\nvar rows\
          \ = [];\nObject.keys(nsSet).sort().forEach(function (n) {\n  rows.push({\n\
          \    '{#NSNAME}': n,\n    '{#NSCPUQUOTA}': nsSet[n].cpu,\n    '{#NSMEMQUOTA}':\
          \ nsSet[n].mem\n  });\n});\nreturn JSON.stringify({ 'data': rows });\n"
      item_prototypes:
      - uuid: 8a50915bdcc54963bb16a99a593393df
        key: thanos.namespace_nsname_status_up_targets[{#NSNAME}]
        name: 'Namespace {#NSNAME}: Status (up targets)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        request_method: GET
        url: '{$THANOS.URL}/api/v1/query?query=count(up%7Bjob%3D%22kubernetes-pods%22%2Cnamespace%3D~%22{#NSNAME}%22%7D)%20by%20(namespace)'
        headers:
        - name: Authorization
          value: Bearer {$THANOS.TOKEN}
        timeout: '{$THANOS.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            if (body.status !== ''success'') { throw ''Thanos API: '' + body.status;
            }

            var v = 0;

            body.data.result.forEach(function (r) { if (parseFloat(r.value[1]) > 0)
            { v++; } });

            return v;

            '
      lld_macro_paths:
      - lld_macro: '{#NSNAME}'
        path: $.namespace
      - lld_macro: '{#NSCPUQUOTA}'
        path: $.cpu
      - lld_macro: '{#NSMEMQUOTA}'
        path: $.mem
      trigger_prototypes:
      - uuid: e5e59bb8803d4932b23c7eabdb8280ee
        expression: max(/OpenShift Thanos API by JS/thanos.namespace_nsname_status_up_targets[{#NSNAME}],{$THANOS.STATUS_NS_TRIGGER}m)=0
        name: 'Namespace {#NSNAME}: sem targets up (down)'
        priority: WARNING
        description: Nenhum alvo `up` no namespace {#NSNAME} nos ultimos {$THANOS.STATUS_NS_TRIGGER}
          minutos.
        manual_close: 'YES'
        tags:
        - tag: namespace
          value: '{#NSNAME}'
        - tag: scope
          value: availability
    tags:
    - tag: class
      value: software
    - tag: target
      value: openshift
    - tag: target
      value: thanos
    valuemaps:
    - uuid: cc73ea27641e425ab3cf28b5eedf58a3
      name: Thanos API status
      mappings:
      - value: OK
        newvalue: Servico OK
      - value: FALHA
        newvalue: Servico FALHA
    vendor:
      name: Internal
      version: '1.0'
  - uuid: 917ae0643ae444f388b63ba3ad6054b2
    template: OpenShift Thanos API by JS Resource Limits
    name: OpenShift Thanos API by JS Resource Limits
    description: 'Coleta por namespace (descoberto pelo template master):

