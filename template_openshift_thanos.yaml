        value: Bearer {$THANOS.TOKEN}
      timeout: '{$THANOS.TIMEOUT}'
      delay: 5m
      lifetime: 30d
      description: Item de suporte para manter a LLD de recursos (dependente do master).
      item_prototypes:
      - uuid: 561f453c2f214093a5c4f5ae79f96e43
        key: thanos.namespace_nsname_cpu_usada_millicores[{#NSNAME}]
        name: 'Namespace {#NSNAME}: CPU usada (millicores)'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        units: m
        request_method: GET
        url: '{$THANOS.URL}/api/v1/query?query=sum(namespace_workload_pod%3Akube_pod_owner%3Arelabel)%20*%200%20%2B%20sum(rate(container_cpu_usage_seconds_total%7Bnamespace%3D~%22{#NSNAME}%22%2Ccontainer%21%3D%22%22%2Cimage%21%3D%22%22%7D%5B{$THANOS.STEP}%5D))'
        headers:
        - name: Authorization
          value: Bearer {$THANOS.TOKEN}
        timeout: '{$THANOS.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            if (body.status !== ''success'') { throw ''Thanos API: '' + body.status;
            }

            return (body.data.result && body.data.result.length) ? (parseFloat(body.data.result[0].value[1])
            * 1000) : 0;

            '
      - uuid: fef4e0dd620c4bf1b900e6a34ba1c75f
        key: thanos.namespace_nsname_memoria_usada_bytes[{#NSNAME}]
