      type: HTTP_AGENT
      value_type: CHAR
      history: '0'
      trends: '0'
      request_method: GET
      url: '{$THANOS.URL}/api/v1/query?query=vector(1)'
      headers:
      - name: Authorization
        value: Bearer {$THANOS.TOKEN}
      timeout: '{$THANOS.TIMEOUT}'
      preprocessing:
      - type: JAVASCRIPT
