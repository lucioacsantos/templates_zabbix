        history: 7d
        trends: 30d
        units: B
        request_method: GET
        url: '{$THANOS.URL}/api/v1/query?query=sum(container_memory_working_set_bytes%7Bnamespace%3D~%22{#NSNAME}%22%2Ccontainer%21%3D%22%22%2Cimage%21%3D%22%22%7D)'
        headers:
        - name: Authorization
          value: Bearer {$THANOS.TOKEN}
        timeout: '{$THANOS.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            if (body.status !== ''success'') { throw ''Thanos API: '' + body.status;
            }

            return (body.data.result && body.data.result.length) ? parseFloat(body.data.result[0].value[1])
            : 0;

            '
      - uuid: 93c8d8dc2ee147fcb2cf666acb740f4c
        key: thanos.namespace_nsname_cpu_do_limite[{#NSNAME}]
        name: 'Namespace {#NSNAME}: CPU % do limite'
        type: HTTP_AGENT
        value_type: FLOAT
        history: 7d
        trends: 30d
        units: '%'
        request_method: GET
        url: '{$THANOS.URL}/api/v1/query?query=100%20*%20sum(rate(container_cpu_usage_seconds_total%7Bnamespace%3D~%22{#NSNAME}%22%2Ccontainer%21%3D%22%22%2Cimage%21%3D%22%22%7D%5B{$THANOS.STEP}%5D))%20%2F%20sum(kube_pod_container_resource_limits%7Bnamespace%3D~%22{#NSNAME}%22%2Cresource%3D%22cpu%22%7D)'
        headers:
        - name: Authorization
          value: Bearer {$THANOS.TOKEN}
        timeout: '{$THANOS.TIMEOUT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var body = JSON.parse(value);

            if (body.status !== ''success'') { throw ''Thanos API: '' + body.status;
            }

            if (!(body.data.result && body.data.result.length)) { return 0; }

            var num = parseFloat(body.data.result[0].value[1]) * 100;

            return isNaN(num) ? 0 : num;

            '
      - uuid: 239e4300c8564adeb4715d08552bc45b
        key: thanos.namespace_nsname_memoria_do_limite[{#NSNAME}]
        name: 'Namespace {#NSNAME}: Memoria % do limite'
