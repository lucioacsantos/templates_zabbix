      key: thanos.discovery.namespace_nsname_containers
      name: 'Namespace {#NSNAME}: Containers'
      type: HTTP_AGENT
      request_method: GET
      url: '{$THANOS.URL}/api/v1/query?query=container_cpu_usage_seconds_total%7Bcontainer%21%3D%22%22%2Cimage%21%3D%22%22%7D'
      headers:
      - name: Authorization
        value: Bearer {$THANOS.TOKEN}
      timeout: '{$THANOS.TIMEOUT}'
      delay: 1h
      lifetime: 30d
      description: Descobre containers COM METRICAS (rodando) por namespace, filtrando
        por {$THANOS.NAMESPACES} (pipe ou virgula, vazio = todos). Igual ao Containers
        V2.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var body = JSON.parse(value);\nif (body.status !== 'success') { throw 'Thanos\
          \ API LLD: ' + body.status; }\nvar STATIC = '{$THANOS.NAMESPACES}';\nvar\
          \ filter = null;\nif (typeof STATIC === 'string' && STATIC.trim() !== '')\
          \ {\n  try { filter = new RegExp('^(?:' + STATIC.trim().split(/[\\s,|]+/).join('|')\
          \ + ')$'); }\n  catch (e) { throw 'Regex invalida em {$THANOS.NAMESPACES}:\
          \ ' + e.message; }\n}\nvar rows = {};\nbody.data.result.forEach(function\
          \ (r) {\n  var m = r.metric || {};\n  if (!m.namespace || !m.pod || !m.container)\
          \ { return; }\n  if (filter && !filter.test(m.namespace)) { return; }\n\
          \  var k = m.namespace + '|' + m.pod + '|' + m.container;\n  if (!rows[k])\
          \ {\n    rows[k] = { '{#NSNAME}': m.namespace, '{#POD}': m.pod, '{#CONTAINER}':\
          \ m.container, '{#APP_NAME}': (m.pod.split('-').slice(0, -2).join('-') ||\
          \ m.pod) };\n  }\n});\nvar data = Object.keys(rows).sort().map(function\
          \ (k) { return rows[k]; });\nif (!data.length) { throw 'LLD de containers\
          \ sem resultados (verifique {$THANOS.NAMESPACES}).'; }\nreturn JSON.stringify({\
          \ 'data': data });\n"
